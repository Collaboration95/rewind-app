<text x="970.0" y="125" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#17324d">Transient Command request</text>
<text x="844" y="163" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#203447">candidate work abstraction</text>
<text x="844" y="181" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#203447">poll creates request</text>
<text x="844" y="199" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#203447">no durable job identity</text>
<text x="844" y="217" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#203447">retry only in memory</text>
