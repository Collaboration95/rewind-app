<text x="444" y="163" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#203447">candidate state abstraction</text>
<text x="444" y="181" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#203447">phase held in memory</text>
<text x="444" y="199" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#203447">not transaction coupled</text>
<text x="444" y="217" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#203447">lost on process exit</text>
