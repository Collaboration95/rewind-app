<text x="1234" y="193" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#203447">writes final path directly</text>
<text x="1234" y="211" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#203447">no generation fence</text>
<text x="1234" y="229" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#203447">no durable ready proof</text>
