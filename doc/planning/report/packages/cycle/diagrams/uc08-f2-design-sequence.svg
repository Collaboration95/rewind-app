<text x="265.5" y="228" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203447">SELECT pending  /</text>
<text x="265.5" y="245" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203447">failed-under-cap  /</text>
<text x="265.5" y="262" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203447">expired processing</text>
<line x1="150.0" y1="292" x2="381.0" y2="292" stroke="#147d83" stroke-width="2" marker-end="url(#arrow)"/>
<text x="265.5" y="310" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203447">BEGIN job transaction;</text>
<text x="265.5" y="327" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203447">inspect status and lease</text>
<rect x="55" y="339.5" width="1345" height="45" rx="9" fill="#fff2d8" stroke="#9aabba"/>
<text x="727.5" y="367" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#203447">processing lease active → already processing; failed at cap → retry exhausted</text>
<line x1="381.0" y1="432" x2="612.0" y2="432" stroke="#147d83" stroke-width="2" marker-end="url(#arrow)"/>
<text x="496.5" y="450" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203447">increment generation; count</text>
<text x="496.5" y="467" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203447">only a new pending / failed</text>
<text x="496.5" y="484" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203447">attempt</text>
<line x1="150.0" y1="514" x2="843.0" y2="514" stroke="#147d83" stroke-width="2" marker-end="url(#arrow)"/>
<text x="496.5" y="532" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203447">process; success attempts generation-fenced publish</text>
<line x1="612.0" y1="584" x2="381.0" y2="584" stroke="#147d83" stroke-width="2" marker-end="url(#arrow)"/>
<text x="496.5" y="602" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203447">UPDATE ready only WHERE</text>
<text x="496.5" y="619" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203447">status=processing AND</text>
<text x="496.5" y="636" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203447">generation matches</text>
<rect x="55" y="643.5" width="1345" height="45" rx="9" fill="#fff2d8" stroke="#9aabba"/>
<text x="727.5" y="671" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#203447">Error → mark failed for same generation; retryable while attempt count &lt; cap</text>
<line x1="381.0" y1="736" x2="1074.0" y2="736" stroke="#147d83" stroke-width="2" marker-end="url(#arrow)"/>
<text x="727.5" y="754" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203447">worker exposes delayed outcome after cap</text>
<line x1="1074.0" y1="806" x2="1305.0" y2="806" stroke="#147d83" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1189.5" y="824" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203447">release gate keeps cycle</text>
<text x="1189.5" y="841" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203447">unpublished</text>
<rect x="55" y="853.5" width="1345" height="45" rx="9" fill="#fff2d8" stroke="#9aabba"/>
<text x="727.5" y="881" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#203447">Expired lease can be reclaimed after process death; stale worker cannot overwrite newer generation</text>
<text x="36" y="1024" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#5c7082">The diagram covers the normal path and named relevant branches; implementation names appear only in the design view.</text></svg>