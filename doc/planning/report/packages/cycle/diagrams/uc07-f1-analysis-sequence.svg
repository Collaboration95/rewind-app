<text x="496.5" y="315" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203447">under write boundary</text>
<rect x="55" y="327.5" width="1345" height="45" rx="9" fill="#fff2d8" stroke="#9aabba"/>
<text x="727.5" y="355" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#203447">If early: report waiting for boundary; do not transition</text>
