<text x="496.5" y="438" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203447">mark closed cycle revealing</text>
<text x="496.5" y="455" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203447">and locked</text>
<line x1="381.0" y1="490" x2="843.0" y2="490" stroke="#147d83" stroke-width="2" marker-end="url(#arrow)"/>
<text x="612.0" y="508" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203447">ensure one compilation request and ordered inputs</text>
<line x1="381.0" y1="560" x2="1074.0" y2="560" stroke="#147d83" stroke-width="2" marker-end="url(#arrow)"/>
<text x="727.5" y="578" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203447">create successor at old end with same duration</text>
<line x1="381.0" y1="630" x2="1305.0" y2="630" stroke="#147d83" stroke-width="2" marker-end="url(#arrow)"/>
<text x="843.0" y="648" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203447">select successor only if pointer still targets old cycle</text>
<path d="M381.0,692 h70 v24 h-70" fill="none" stroke="#147d83" stroke-width="2" marker-end="url(#arrow)"/>
<text x="416.0" y="718" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203447">commit transition</text>
<text x="416.0" y="735" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203447">and outcome</text>
<rect x="55" y="737.0" width="1345" height="66" rx="9" fill="#fff2d8" stroke="#9aabba"/>
<text x="727.5" y="765" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#203447">Relevant failures: missing cycle; invalid interval / state; write transaction rolls back; unsettled inputs delay film</text>
<text x="727.5" y="786" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#203447">publication</text>
<text x="36" y="918" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#5c7082">The diagram covers the normal path and named relevant branches; implementation names appear only in the design view.</text></svg>