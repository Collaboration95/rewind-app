<text x="381.0" y="169" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#17324d">advance Cycle</text>
<text x="381.0" y="186" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#17324d">Lifecycle…</text>
<line x1="381.0" y1="202" x2="381.0" y2="962" stroke="#9aabba" stroke-width="2" stroke-dasharray="6 7"/>
