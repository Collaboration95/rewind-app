<text x="36" y="52" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#17324d">UC07-F1 · Design sequence</text>
<text x="36" y="80" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#5c7082">Scheduler tick, SQLite writer transaction, durable work, immediate successor</text>
