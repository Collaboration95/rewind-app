<text x="727.5" y="917" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#203447">Empty / unavailable / tampered input, invalid filler, probe failure, or changed snapshot → failed; remove temp / unpublished</text>
<text x="727.5" y="938" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#203447">object</text>
<text x="36" y="1070" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#5c7082">The diagram covers the normal path and named relevant branches; implementation names appear only in the design view.</text></svg>