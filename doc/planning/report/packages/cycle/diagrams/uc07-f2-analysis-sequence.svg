<text x="727.5" y="775" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#203447">Older-cycle replay never rewinds a pointer already moved forward; invalid group / interval / status is rejected</text>
<text x="36" y="918" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#5c7082">The diagram covers the normal path and named relevant branches; implementation names appear only in the design view.</text></svg>