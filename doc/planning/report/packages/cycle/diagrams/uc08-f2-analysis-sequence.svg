<text x="727.5" y="775" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#203447">Old worker after reclaim is fenced from ready publication and can clean only its generation output</text>
<text x="36" y="918" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#5c7082">The diagram covers the normal path and named relevant branches; implementation names appear only in the design view.</text></svg>