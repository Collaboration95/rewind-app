<text x="381.0" y="595" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203447">attempt</text>
<line x1="381.0" y1="630" x2="843.0" y2="630" stroke="#147d83" stroke-width="2" marker-end="url(#arrow)"/>
