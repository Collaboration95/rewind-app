<text x="1189.5" y="718" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203447">finalize only if this claim</text>
<text x="1189.5" y="735" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203447">generation still owns job</text>
