middle" font-family="Arial,sans-serif" font-size="14" fill="#1e293b">key</text><line x1="438" y1="354" x2="707" y2="354" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="440" y="300" width="268" height="42" rx="5" fill="#fff" opacity=".98"/><text x="574" y="320" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#1e293b">validate ≤10 MiB; duration=3s</text><line x1="734" y1="446" x2="1003" y2="446" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="736" y="392" width="268" height="42" rx="5" fill="#fff" opacity=".98"/><text x="870" y="412" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#1e293b">request intent OR stage image</text><line x1="1006" y1="538" x2="737" y2="538" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="736" y="484" width="268" height="42" rx="5" fill="#fff" opacity=".98"/><text x="870" y="504" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#1e293b">return capability OR staged URI</text><line x1="734" y1="630" x2="1003" y2="630" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="736" y="576" width="268" height="42" rx="5" fill="#fff" opacity=".98"/><text x="870" y="596" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#1e293b">PUT exact bytes OR</text><text x="870" y="613" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#1e293b">authenticated intake</text><line x1="1030" y1="722" x2="1299" y2="722" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="1032" y="668" width="268" height="42" rx="5" fill="#fff" opacity=".98"/><text x="1166" y="688" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#1e293b">complete version OR post staged</text><text x="1166" y="705" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#1e293b">reference</text><path d="M1326 814 H1396 V850 H1328" fill="none" 