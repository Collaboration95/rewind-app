<svg xmlns="http://www.w3.org/2000/svg" width="1740" height="1310" viewBox="0 0 1740 1310" role="img" aria-labelledby="title desc"><title id="title">UC05-F1 — Capture and review a photo</title><desc id="desc">Analysis sequence · managed preview and operation ownership</desc><defs><marker id="arrow" markerWidth="12" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#334155"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="48" y="52" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#102a43">UC05-F1 — Capture and review a photo</text><text x="48" y="84" font-family="Arial,sans-serif" font-size="17" fill="#475569">Analysis sequence · managed preview and operation ownership</text><rect x="18" y="108" width="224" height="86" rx="10" fill="#eef2ff" stroke="#64748b" stroke-width="2"/><text x="130" y="132" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#102a43">Member</text><text x="130" y="177" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#475569">Actor</text><line x1="130" y1="194" x2="130" y2="1120" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 7"/><rect x="314" y="108" width="224" height="86" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="426" y="132" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#102a43">Still-capture UI</text><text x="426" y="177" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#475569">Analysis role</text><line x1="426" y1="194" x2="426" y2="1120" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 7"/><rect x="610" y="108" width="224" height="86" rx="10" fill="#eef2ff" stroke="#64748b" stroke-width="2"/><text x="722" y="132" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#102a43">Camera boundary</text><text x="722" y="177" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#475569">Analysis role</text><line x1="722" y1="194" x2="722" y2="1120" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 7"/><rect x="906" y="108" width="224" height="86" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="1018" y="132" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#102a43">Still session</text><text x="1018" y="177" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#475569">Analysis role</text><line x1="1018" y1="194" x2="1018" y2="1120" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 7"/><rect x="1202" y="108" width="224" height="86" rx="10" fill="#eef2ff" stroke="#64748b" stroke-width="2"/><text x="1314" y="132" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#102a43">File + metadata</text><text x="1314" y="177" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#475569">Boundary</text><line x1="1314" y1="194" x2="1314" y2="1120" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 7"/><rect x="1498" y="108" width="224" height="86" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="1610" y="132" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#102a43">Preview state</text><text x="1610" y="177" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#475569">Result</text><line x1="1610" y1="194" x2="1610" y2="1120" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 7"/><line x1="142" y1="262" x2="411" y2="262" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="144" y="208" width="268" height="42" rx="5" fill="#fff" opacity=".98"/><text x="278" y="228" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#1e293b">request permission capture</text><text x="278" y="245" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#1e293b">still</text><line x1="438" y1="354" x2="707" y2="354" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="440" y="300" width="268" height="42" rx="5" fill="#fff" opacity=".98"/><text x="574" y="320" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#1e293b">check camera capability +</text><text x="574" y="337" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#1e293b">permission</text><line x1="438" y1="446" x2="707" y2="446" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="440" y="392" width="268" height="42" rx="5" fill="#fff" opacity=".98"/><text x="574" y="412" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#1e293b">capture image bytes</text><line x1="734" y1="538" x2="1003" y2="538" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="736" y="484" width="268" height="42" rx="5" fill="#fff" opacity=".98"/><text x="870" y="504" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#1e293b">validate and copy to managed</text><text x="870" y="521" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#1e293b">storage</text><line x1="1030" y1="630" x2="1299" y2="630" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="1032" y="576" width="268" height="42" rx="5" fill="#fff" opacity=".98"/><text x="1166" y="596" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#1e293b">persist facts without preview</text><text x="1166" y="613" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#1e293b">URI</text><line x1="1030" y1="722" x2="1299" y2="722" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="1032" y="668" width="268" height="42" rx="5" fill="#fff" opacity=".98"/><text x="1166" y="688" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#1e293b">return owned preview</text><line x1="1030" y1="814" x2="1595" y2="814" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="1180" y="760" width="268" height="42" rx="5" fill="#fff" opacity=".98"/><text x="1314" y="780" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#1e293b">show preview</text><line x1="438" y1="906" x2="1595" y2="906" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="884" y="852" width="268" height="42" rx="5" fill="#fff" opacity=".98"/><text x="1018" y="872" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#1e293b">retake, discard or submit</text><line x1="142" y1="998" x2="411" y2="998" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="144" y="944" width="268" height="42" rx="5" fill="#fff" opacity=".98"/><text x="278" y="964" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#1e293b">retake/discard cleans owned</text><text x="278" y="981" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#1e293b">file + metadata</text><rect x="48" y="1138" width="1644" height="150" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/><text x="70" y="1166" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#9a3412">Relevant alternate / exception paths</text><text x="70" y="1192" font-family="Arial,sans-serif" font-size="14" fill="#7c2d12">Denied permission offers recovery; unsupported live capture may use labelled file fallback. Camera, copy, metadata or file-store failure never publishes ready</text><text x="70" y="1213" font-family="Arial,sans-serif" font-size="14" fill="#7c2d12">preview. Late result after interruption is discarded only if still owned by the old operation. Background abandons in-flight capture and discards preview.</text></svg>
