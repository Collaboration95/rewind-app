dle" font-family="Arial,sans-serif" font-size="14" fill="#1e293b">contribution</text><line x1="438" y1="354" x2="707" y2="354" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="440" y="300" width="268" height="42" rx="5" fill="#fff" opacity=".98"/><text x="574" y="320" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#1e293b">DELETE scoped contribution ID</text><line x1="734" y1="446" x2="1003" y2="446" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="736" y="392" width="268" height="42" rx="5" fill="#fff" opacity=".98"/><text x="870" y="412" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#1e293b">verify owner, group, cycle,</text><text x="870" y="429" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#1e293b">window, job state</text><path d="M1030 538 H1100 V574 H1032" fill="none" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="931" y="484" width="268" height="42" rx="5" fill="#fff" opacity=".98"/><text x="1065" y="504" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#1e293b">require deletion allowance</text><text x="1065" y="521" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#1e293b">unused</text><line x1="1030" y1="630" x2="1299" y2="630" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="1032" y="576" width="268" height="42" rx="5" fill="#fff" opacity=".98"/><text x="1166" y="596" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#1e293b">tombstone; restore item/time;</text><text x="1166" y="613" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#1e293b">clear refs</text><line x1="1326" y1="722" x2="1595" y2="722" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="1328" y="668" width="268" height="42" rx="5" fill="#fff" opacity=".98"/><text x="1462" y="688" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#1e293b">commit then bounded owned-media</text><text x="1462" y="705" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#1e293b">cleanup</text><line x1="142" y1="814" x2="411" y2="814" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="144" y="760" width="268" height="42" rx="5" fill="#fff" opacity=".98"/><text x="278" y="780" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#1e293b">submit replacement with exact</text><text x="278" y="797" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#1e293b">target ID</text><line x1="438" y1="906" x2="707" y2="906" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="440" y="852" width="268" height="42" rx="5" fill="#fff" opacity=".98"/><text x="574" y="872" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#1e293b">post keyed contribution</text><line x1="734" y1="998" x2="1003" y2="998" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="736" y="944" width="268" height="42" rx="5" fill="#fff" opacity=".98"/><text x="870" y="964" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#1e293b">reserve quota and recheck</text><text x="870" y="981" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#1e293b">target</text><line x1="1030" y1="1090" x2="1299" y2="1090" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="1032" y="1036" width="268" height="42" rx="5" fill="#fff" opacity=".98"/><text x="1166" y="1056" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#1e293b">link accepted replacement</text><text x="1166" y="1073" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#1e293b">atomically</text><line x1="1302" y1="1182" x2="441" y2="1182" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="736" y="1128" width="268" height="42" rx="5" fill="#fff" opacity=".98"/><text x="870" y="1148" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#1e293b">show replacement status</text><rect x="48" y="1322" width="1644" height="150" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/><text x="70" y="1350" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#9a3412">Relevant alternate / exception paths</text><text x="70" y="1376" font-family="Arial,sans-serif" font-size="14" fill="#7c2d12">Other member/group/window, closed cycle, deleted/ineligible/processing job, used correction or existing replacement is rejected. Replacement race rolls back new</text><text x="70" y="1397" font-family="Arial,sans-serif" font-size="14" fill="#7c2d12">job. Failed replacement can retry against same target where idempotency permits; cannot spend a second correction. Post-commit file cleanup is idempotent and</text><text x="70" y="1418" font-family="Arial,sans-serif" font-size="14" fill="#7c2d12">bounded.</text></svg>
