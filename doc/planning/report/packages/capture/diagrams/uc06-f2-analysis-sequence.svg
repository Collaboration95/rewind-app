<svg xmlns="http://www.w3.org/2000/svg" width="1740" height="1494" viewBox="0 0 1740 1494" role="img" aria-labelledby="title desc"><title id="title">UC06-F2 — Delete and replace once</title><desc id="desc">Analysis sequence · same-window eligibility, allowance restoration and linked replacement</desc><defs><marker id="arrow" markerWidth="12" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#334155"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="48" y="52" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#102a43">UC06-F2 — Delete and replace once</text><text x="48" y="84" font-family="Arial,sans-serif" font-size="17" fill="#475569">Analysis sequence · same-window eligibility, allowance restoration and linked replacement</text><rect x="18" y="108" width="224" height="86" rx="10" fill="#eef2ff" stroke="#64748b" stroke-width="2"/><text x="130" y="132" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#102a43">Member</text><text x="130" y="177" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#475569">Actor</text><line x1="130" y1="194" x2="130" y2="1304" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 7"/><rect x="314" y="108" width="224" height="86" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="426" y="132" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#102a43">Own-contribution ledger</text><text x="426" y="177" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#475569">Analysis role</text><line x1="426" y1="194" x2="426" y2="1304" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 7"/><rect x="610" y="108" width="224" height="86" rx="10" fill="#eef2ff" stroke="#64748b" stroke-width="2"/><text x="722" y="132" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#102a43">Delete/upload API<