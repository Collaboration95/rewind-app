ial,sans-serif" font-size="14" fill="#1e293b">transaction</text><line x1="142" y1="1274" x2="411" y2="1274" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="144" y="1220" width="268" height="42" rx="5" fill="#fff" opacity=".98"/><text x="278" y="1240" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#1e293b">return linked upload/status</text><rect x="48" y="1414" width="1644" height="150" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/><text x="70" y="1442" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#9a3412">Relevant alternate / exception paths</text><text x="70" y="1468" font-family="Arial,sans-serif" font-size="14" fill="#7c2d12">Reject wrong member/group, non-collecting or prior window, processing/ineligible/deleted item, already-used deletion or existing replacement. Race returns</text><text x="70" y="1489" font-family="Arial,sans-serif" font-size="14" fill="#7c2d12">conflict and rolls back new contribution/job. File cleanup occurs after authoritative tombstone and is bounded to configured roots.</text></svg>
