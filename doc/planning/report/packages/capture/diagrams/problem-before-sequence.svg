<svg xmlns="http://www.w3.org/2000/svg" width="1740" height="884" viewBox="0 0 1740 884" role="img" aria-labelledby="title desc"><title id="title">Before — coupled contribution path</title><desc id="desc">Conceptual pressure sequence; this does not assert a historical production trace.</desc><defs><marker id="arrow" markerWidth="12" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#334155"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="48" y="52" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#102a43">Before — coupled contribution path</text><text x="48" y="84" font-family="Arial,sans-serif" font-size="17" fill="#475569">Conceptual pressure sequence; this does not assert a historical production trace.</text><rect x="18" y="108" width="224" height="62" rx="10" fill="#eef2ff" stroke="#64748b" stroke-width="2"/><text x="130" y="134" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#102a43">Member</text><text x="130" y="154" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#475569">Actor</text><line x1="130" y1="170" x2="130" y2="714" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 7"/><rect x="314" y="108" width="224" height="62" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="426" y="134" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#102a43">Capture controller</text><text x="426" y="154" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#475569">all concerns</text><line x1="426" y1="170" x2="426" y2="714" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 7"/><rect x="610" y="108" width="224" height="62" rx="10" fill="#eef2ff" stroke="#64748b" stroke-width="2"/><text x="722" y="134" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#102a43">Camera APIs</text><text x="722" y="154" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#475569">concrete platform</text><line x1="722" y1="170" x2="722" y2="714" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 7"/><rect x="906" y="108" width="224" height="62" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="1018" y="134" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#102a43">Upload + storage</text><text x="1018" y="154" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#475569">protocol details</text><line x1="1018" y1="170" x2="1018" y2="714" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 7"/><rect x="1202" y="108" width="224" height="62" rx="10" fill="#eef2ff" stroke="#64748b" stroke-width="2"/><text x="1314" y="134" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#102a43">Quota + DB</text><text x="1314" y="154" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#475569">policy state</text><line x1="1314" y1="170" x2="1314" y2="714" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 7"/><rect x="1498" y="108" width="224" height="62" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="1610" y="134" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#102a43">FFmpeg</text><text x="1610" y="154" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#475569">processing</text><line x1="1610" y1="170" x2="1610" y2="714" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 7"/><line x1="142" y1="192" x2="411" y2="192" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="132" y="163" width="292" height="28" rx="5" fill="#fff" opacity=".97"/><text x="278" y="182" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#1e293b">capture; preview; trim; choose mode</text><line x1="438" y1="262" x2="707" y2="262" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="428" y="233" width="292" height="28" rx="5" fill="#fff" opacity=".97"/><text x="574" y="252" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#1e293b">call concrete platform API</text><line x1="710" y1="332" x2="441" y2="332" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="428" y="303" width="292" height="28" rx="5" fill="#fff" opacity=".97"/><text x="574" y="322" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#1e293b">return device-specific clip</text><line x1="438" y1="402" x2="1003" y2="402" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="576" y="373" width="292" height="28" rx="5" fill="#fff" opacity=".97"/><text x="722" y="392" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#1e293b">stage / sign / PUT / reconcile inline</text><line x1="1030" y1="472" x2="1299" y2="472" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="1020" y="443" width="292" height="28" rx="5" fill="#fff" opacity=".97"/><text x="1166" y="462" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#1e293b">reserve quota + create job</text><line x1="438" y1="542" x2="1595" y2="542" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="872" y="513" width="292" height="28" rx="5" fill="#fff" opacity=".97"/><text x="1018" y="532" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#1e293b">select filters and process</text><line x1="1598" y1="612" x2="441" y2="612" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="872" y="583" width="292" height="28" rx="5" fill="#fff" opacity=".97"/><text x="1018" y="602" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#1e293b">return lifecycle state</text><rect x="48" y="734" width="1644" height="120" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/><text x="70" y="762" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#9a3412">Relevant alternate / exception paths</text><text x="70" y="787" font-family="Arial,sans-serif" font-size="14" fill="#7c2d12">Conceptual failure pressure: browser/native differences leak into UI; transfer failure, quota decisions, correction and processor behavior share one workflow;</text><text x="70" y="808" font-family="Arial,sans-serif" font-size="14" fill="#7c2d12">testing and replacement of one variation can affect the others. No historical implementation is asserted.</text></svg>
