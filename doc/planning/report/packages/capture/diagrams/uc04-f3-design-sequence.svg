<svg xmlns="http://www.w3.org/2000/svg" width="1740" height="1586" viewBox="0 0 1740 1586" role="img" aria-labelledby="title desc"><title id="title">UC04-F3 — Transfer, accept and process video</title><desc id="desc">Design sequence · configured direct capability or authenticated staged intake</desc><defs><marker id="arrow" markerWidth="12" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#334155"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="48" y="52" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#102a43">UC04-F3 — Transfer, accept and process video</text><text x="48" y="84" font-family="Arial,sans-serif" font-size="17" fill="#475569">Design sequence · configured direct capability or authenticated staged intake</text><rect x="18" y="108" width="224" height="86" rx="10" fill="#ecfeff" stroke="#64748b" stroke-width="2"/><text x="130" y="132" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#102a43">Member</text><text x="130" y="177" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#475569">Actor</text><line x1="130" y1="194" x2="130" y2="1396" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 7"/><rect x="314" y="108" width="224" height="86" rx="10" fill="#f0fdfa" stroke="#64748b" stroke-width="2"/><text x="426" y="132" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#102a43">Video Capture Screen</text><text x="426" y="177" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#475569">Workflow</text><line x1="426" y1="194" x2="426" y2="1396" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 7"/><rect x="610" y="108" width="224" height="86" rx="10" fill="#ecfeff" stroke="#64748b" stroke-width="2"/><text x="722" y="132" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#102a43">Real Account Video</text><text x="722" y="149" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#102a43">Runtime</text><text x="722" y="177" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#475569">Client adapter</text><line x1="722" y1="194" x2="722" y2="1396" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 7"/><rect x="906" y="108" width="224" height="86" rx="10" fill="#f0fdfa" stroke="#64748b" stroke-width="2"/><text x="1018" y="132" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#102a43">Upload intent / staged</text><text x="1018" y="149" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#102a43">intake</text><text x="1018" y="177" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#475569">HTTP boundary</text><line x1="1018" y1="194" x2="1018" y2="1396" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 7"/><rect x="1202" y="108" width="224" height="86" rx="10" fill="#ecfeff" stroke="#64748b" stroke-width="2"/><text x="1314" y="132" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#102a43">Contribution + quota</text><text x="1314" y="177" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#475569">Server transaction</text><line x1="1314" y1="194" x2="1314" y2="1396" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 7"/><rect x="1498" y="108" width="224" height="86" rx="10" fill="#f0fdfa" stroke="#64748b" stroke-width="2"/><text x="1610" y="132" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#102a43">FFmpeg</text><text x="1610" y="177" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#475569">Job processor</text><line x1="1610" y1="194" x2="1610" y2="1396" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 7"/><line x1="142" y1="262" x2="411" y2="262" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="144" y="208" width="268" height="42" rx="5" fill="#fff" opacity=".98"/><text x="278" y="228" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#1e293b">Submit review</text><line x1="438" y1="354" x2="707" y2="354" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="440" y="300" width="268" height="42" rx="5" fill="#fff" opacity=".98"/><text x="574" y="320" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#1e293b">persist pending metadata; read</text><text x="574" y="337" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#1e293b">clip</text><line x1="734" y1="446" x2="1003" y2="446" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="736" y="392" width="268" height="42" rx="5" fill="#fff" opacity=".98"/><text x="870" y="412" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#1e293b">read media config-selected mode</text><line x1="1006" y1="538" x2="737" y2="538" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="736" y="484" width="268" height="42" rx="5" fill="#fff" opacity=".98"/><text x="870" y="504" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#1e293b">request intent + checkpoint</text><text x="870" y="521" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#1e293b">(direct) OR POST staged source</text><line x1="734" y1="630" x2="1003" y2="630" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="736" y="576" width="268" height="42" rx="5" fill="#fff" opacity=".98"/><text x="870" y="596" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#1e293b">capability + intent OR staged</text><text x="870" y="613" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#1e293b">URI</text><line x1="1030" y1="722" x2="1299" y2="722" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="1032" y="668" width="268" height="42" rx="5" fill="#fff" opacity=".98"/><text x="1166" y="688" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#1e293b">PUT bytes pin version OR POST</text><text x="1166" y="705" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#1e293b">contribution metadata</text><path d="M1326 814 H1396 V850 H1328" fill="none" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="1227" y="760" width="268" height="42" rx="5" fill="#fff" opacity=".98"/><text x="1361" y="780" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#1e293b">complete intent OR</text><text x="1361" y="797" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#1e293b">/contributions/upload</text><line x1="1326" y1="906" x2="1595" y2="906" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="1328" y="852" width="268" height="42" rx="5" fill="#fff" opacity=".98"/><text x="1462" y="872" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#1e293b">auth + source + quota; create</text><text x="1462" y="889" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#1e293b">contribution/job</text><line x1="1598" y1="998" x2="1329" y2="998" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="1328" y="944" width="268" height="42" rx="5" fill="#fff" opacity=".98"/><text x="1462" y="964" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#1e293b">process accepted video trim +</text><text x="1462" y="981" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#1e293b">mode</text><line x1="438" y1="1090" x2="707" y2="1090" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="440" y="1036" width="268" height="42" rx="5" fill="#fff" opacity=".98"/><text x="574" y="1056" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#1e293b">ready failed</text><line x1="414" y1="1182" x2="145" y2="1182" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="144" y="1128" width="268" height="42" rx="5" fill="#fff" opacity=".98"/><text x="278" y="1148" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#1e293b">return status; refresh own</text><text x="278" y="1165" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#1e293b">ledger</text><path d="M438 1274 H500 V1308 H441" fill="none" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="339" y="1220" width="268" height="42" rx="473" fill="#fff" opacity=".98"/><text x="473" y="1240" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#1e293b">success releases local review</text><text x="278" y="1257" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#1e293b">clip</text><rect x="48" y="1414" width="1644" height="150" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/><text x="70" y="1442" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#9a3412">Relevant alternate / exception paths</text><text x="70" y="1468" font-family="Arial,sans-serif" font-size="14" fill="#7c2d12">Transfer client checkpoints and reconciles before resending. Direct upload uses signed storage capability with app credentials omitted; server-mode uses</text><text x="70" y="1489" font-family="Arial,sans-serif" font-size="14" fill="#7c2d12">authenticated staged endpoint. Closed cycle, authorization, invalid source/metadata, quota or replacement conflict rejects. FFmpeg validation/processing failure</text><text x="70" y="1510" font-family="Arial,sans-serif" font-size="14" fill="#7c2d12">is retryable; cancellation/cleanup are distinct from server acceptance.</text></svg>
