<svg xmlns="http://www.w3.org/2000/svg" width="1740" height="1402" viewBox="0 0 1740 1402" role="img" aria-labelledby="title desc"><title id="title">UC04-F2 — Review, trim, mode or retake</title><desc id="desc">Analysis sequence · local review does not submit media</desc><defs><marker id="arrow" markerWidth="12" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#334155"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="48" y="52" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#102a43">UC04-F2 — Review, trim, mode or retake</text><text x="48" y="84" font-family="Arial,sans-serif" font-size="17" fill="#475569">Analysis sequence · local review does not submit media</text><rect x="18" y="108" width="224" height="86" rx="10" fill="#eef2ff" stroke="#64748b" stroke-width="2"/><text x="130" y="132" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#102a43">Member</text><text x="130" y="177" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#475569">Actor</text><line x1="130" y1="194" x2="130" y2="1212" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 7"/><rect x="314" y="108" width="224" height="86" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="426" y="132" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#102a43">Review UI</text><text x="426" y="177" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#475569">Analysis role</text><line x1="426" y1="194" x2="426" y2="1212" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 7"/><rect x="610" y="108" width="224" height="86" rx="10" fill="#eef2ff" stroke="#64748b" stroke-width="2"/><text x="722" y="132" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#102a43">Playback port</text><text x="722" y="177" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#475569">Analysis role</text><line x1="722" y1="194" x2="722" y2="1212" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 7"/><rect x="906" y="108" width="224" height="86" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="1018" y="132" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#102a43">Review session</text><text x="1018" y="177" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#475569">Analysis role</text><line x1="1018" y1="194" x2="1018" y2="1212" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 7"/><rect x="1202" y="108" width="224" height="86" rx="10" fill="#eef2ff" stroke="#64748b" stroke-width="2"/><text x="1314" y="132" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#102a43">Owned media</text><text x="1314" y="177" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#475569">Boundary</text><line x1="1314" y1="194" x2="1314" y2="1212" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 7"/><rect x="1498" y="108" width="224" height="86" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="1610" y="132" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#102a43">Upload session</text><text x="1610" y="177" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#475569">Boundary</text><line x1="1610" y1="194" x2="1610" y2="1212" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 7"/><line x1="142" y1="262" x2="411" y2="262" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="144" y="208" width="268" height="42" rx="5" fill="#fff" opacity=".98"/><text x="278" y="228" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#1e293b">play, seek, enter trim bounds</text><line x1="438" y1="354" x2="707" y2="354" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="440" y="300" width="268" height="42" rx="5" fill="#fff" opacity=".98"/><text x="574" y="320" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#1e293b">validate against clip duration</text><line x1="142" y1="446" x2="411" y2="446" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="144" y="392" width="268" height="42" rx="5" fill="#fff" opacity=".98"/><text x="278" y="412" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#1e293b">accept bounds ≥ 0.5 seconds</text><line x1="438" y1="538" x2="1003" y2="538" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="588" y="484" width="268" height="42" rx="5" fill="#fff" opacity=".98"/><text x="722" y="504" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#1e293b">choose one implemented mode</text><line x1="1006" y1="630" x2="441" y2="630" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="588" y="576" width="268" height="42" rx="5" fill="#fff" opacity=".98"/><text x="722" y="596" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#1e293b">save trim + mode</text><line x1="142" y1="722" x2="411" y2="722" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="144" y="668" width="268" height="42" rx="5" fill="#fff" opacity=".98"/><text x="278" y="688" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#1e293b">submit or retake</text><line x1="438" y1="814" x2="707" y2="814" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="440" y="760" width="268" height="42" rx="5" fill="#fff" opacity=".98"/><text x="574" y="780" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#1e293b">on submit: keyed upload begins</text><line x1="734" y1="906" x2="1299" y2="906" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="884" y="852" width="268" height="42" rx="5" fill="#fff" opacity=".98"/><text x="1018" y="872" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#1e293b">on retake: unmount player</text><line x1="438" y1="998" x2="1003" y2="998" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="588" y="944" width="268" height="42" rx="5" fill="#fff" opacity=".98"/><text x="722" y="964" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#1e293b">release owned clip after</text><text x="722" y="981" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#1e293b">unmount</text><line x1="438" y1="1090" x2="1595" y2="1090" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="884" y="1036" width="268" height="42" rx="5" fill="#fff" opacity=".98"/><text x="1018" y="1056" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#1e293b">clear pending review metadata</text><rect x="48" y="1230" width="1644" height="150" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/><text x="70" y="1258" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#9a3412">Relevant alternate / exception paths</text><text x="70" y="1284" font-family="Arial,sans-serif" font-size="14" fill="#7c2d12">Invalid/out-of-range/too-short trim remains in review. Landscape, non-MP4, missing audio or invalid duration fails validation. Player failure offers</text><text x="70" y="1305" font-family="Arial,sans-serif" font-size="14" fill="#7c2d12">recovery/retake. Cleanup failure retains the clip and reports an error; backgrounded upload is cancelled and retry depends on the session budget.</text></svg>
