<svg xmlns="http://www.w3.org/2000/svg" width="1740" height="1094" viewBox="0 0 1740 1094" role="img" aria-labelledby="title desc"><title id="title">After — configured transfer and processing</title><desc id="desc">Code-backed sequence at accepted SHA; direct transfer is conditional on server configuration.</desc><defs><marker id="arrow" markerWidth="12" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#334155"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="48" y="52" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#102a43">After — configured transfer and processing</text><text x="48" y="84" font-family="Arial,sans-serif" font-size="17" fill="#475569">Code-backed sequence at accepted SHA; direct transfer is conditional on server configuration.</text><rect x="18" y="108" width="224" height="62" rx="10" fill="#ecfeff" stroke="#64748b" stroke-width="2"/><text x="130" y="134" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#102a43">Member</text><text x="130" y="154" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#475569">Actor</text><line x1="130" y1="170" x2="130" y2="924" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 7"/><rect x="314" y="108" width="224" height="62" rx="10" fill="#f0fdfa" stroke="#64748b" stroke-width="2"/><text x="426" y="134" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#102a43">VideoCaptureScreen</text><text x="426" y="154" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#475569">workflow</text><line x1="426" y1="170" x2="426" y2="924" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 7"/><rect x="610" y="108" width="224" height="62" rx="10" fill="#ecfeff" stroke="#64748b" stroke-width="2"/><text x="722" y="134" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#102a43">Runtime client</text><text x="722" y="154" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#475569">routing adapter</text><line x1="722" y1="170" x2="722" y2="924" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 7"/><rect x="906" y="108" width="224" height="62" rx="10" fill="#f0fdfa" stroke="#64748b" stroke-width="2"/><text x="1018" y="134" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#102a43">Intent / staged API</text><text x="1018" y="154" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#475569">server boundary</text><line x1="1018" y1="170" x2="1018" y2="924" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 7"/><rect x="1202" y="108" width="224" height="62" rx="10" fill="#ecfeff" stroke="#64748b" stroke-width="2"/><text x="1314" y="134" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#102a43">Quota + job</text><text x="1314" y="154" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#475569">service</text><line x1="1314" y1="170" x2="1314" y2="924" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 7"/><rect x="1498" y="108" width="224" height="62" rx="10" fill="#f0fdfa" stroke="#64748b" stroke-width="2"/><text x="1610" y="134" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#102a43">Private store + FFmpeg</text><text x="1610" y="154" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#475569">storage / worker</text><line x1="1610" y1="170" x2="1610" y2="924" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 7"/><line x1="142" y1="192" x2="411" y2="192" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="132" y="163" width="292" height="28" rx="5" fill="#fff" opacity=".97"/><text x="278" y="182" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#1e293b">submit reviewed clip + idempotency key</text><line x1="438" y1="262" x2="707" y2="262" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="428" y="233" width="292" height="28" rx="5" fill="#fff" opacity=".97"/><text x="574" y="252" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#1e293b">read clip; pass metadata</text><line x1="734" y1="332" x2="1003" y2="332" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="724" y="303" width="292" height="28" rx="5" fill="#fff" opacity=".97"/><text x="870" y="322" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#1e293b">route by server media config</text><line x1="1006" y1="402" x2="737" y2="402" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="724" y="373" width="292" height="28" rx="5" fill="#fff" opacity=".97"/><text x="870" y="392" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#1e293b">capability/intent OR staged receipt</text><line x1="734" y1="472" x2="1003" y2="472" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="724" y="443" width="292" height="28" rx="5" fill="#fff" opacity=".97"/><text x="870" y="462" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#1e293b">PUT exact version OR staged intake</text><line x1="1030" y1="542" x2="1299" y2="542" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="1020" y="513" width="292" height="28" rx="5" fill="#fff" opacity=".97"/><text x="1166" y="532" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#1e293b">complete OR create staged upload</text><line x1="1326" y1="612" x2="1595" y2="612" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="1316" y="583" width="292" height="28" rx="5" fill="#fff" opacity=".97"/><text x="1462" y="602" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#1e293b">validate; reserve quota; create job</text><line x1="1598" y1="682" x2="1329" y2="682" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="1316" y="653" width="292" height="28" rx="5" fill="#fff" opacity=".97"/><text x="1462" y="672" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#1e293b">persist/transform accepted bytes</text><line x1="1302" y1="752" x2="737" y2="752" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="872" y="723" width="292" height="28" rx="5" fill="#fff" opacity=".97"/><text x="1018" y="742" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#1e293b">return pending/processed state</text><line x1="710" y1="822" x2="441" y2="822" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="428" y="793" width="292" height="28" rx="5" fill="#fff" opacity=".97"/><text x="574" y="812" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#1e293b">refresh own ledger; dispose local clip</text><rect x="48" y="944" width="1644" height="120" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/><text x="70" y="972" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#9a3412">Relevant alternate / exception paths</text><text x="70" y="997" font-family="Arial,sans-serif" font-size="14" fill="#7c2d12">Direct transfer reconciles intent/version before retry. Staged intake verifies its source binding. Both paths converge on server authority, quota and job</text><text x="70" y="1018" font-family="Arial,sans-serif" font-size="14" fill="#7c2d12">creation. Processing errors remain job failures; pre-upload retro is not part of this implemented sequence.</text></svg>
