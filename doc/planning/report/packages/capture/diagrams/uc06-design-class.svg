<svg xmlns="http://www.w3.org/2000/svg" width="1740" height="710" viewBox="0 0 1740 710" role="img" aria-labelledby="title desc"><title id="title">UC06 — design classes</title><desc id="desc">Code-backed quota, contribution, upload-intent, ledger and media responsibilities at the pinned source cut.</desc><defs><marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#64748b"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="48" y="52" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#102a43">UC06 — design classes</text><text x="48" y="84" font-family="Arial,sans-serif" font-size="17" fill="#475569">Code-backed responsibilities at the exact accepted commit.</text><path d="M439 237.5 L483 237.5" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/><path d="M842 237.5 L886 237.5" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/><path d="M1245 237.5 L1289 237.5" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/><path d="M1065.5 312 L1065.5 342 L259.5 363 L259.5 393" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/><path d="M1468.5 312 L1468.5 342 L662.5 363 L662.5 393" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/><path d="M439 467.5 L483 467.5" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/><path d="M842 467.5 L886 467.5" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/><rect x="72" y="155" width="375" height="165" rx="12" fill="#f8fafc" stroke="#475569" stroke-width="2"/><rect x="72" y="155" width="375" height="42" rx="12" fill="#dbeafe"/><path d="M72 197 H447" stroke="#475569"/><text x="259.5" y="183" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#102a43">Member</text><text x="90" y="225" font-family="Arial,sans-serif" font-size="15" fill="#334155">reads own allowance</text><text x="90" y="249" font-family="Arial,sans-serif" font-size="15" fill="#334155">requests one correction</text><rect x="475" y="155" width="375" height="165" rx="12" fill="#eff6ff" stroke="#475569" stroke-width="2"/><rect x="475" y="155" width="375" height="42" rx="12" fill="#dbeafe"/><path d="M475 197 H850" stroke="#475569"/><text x="662.5" y="183" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#102a43">ContributionLedger UI</text><text x="493" y="225" font-family="Arial,sans-serif" font-size="15" fill="#334155">self-scoped rows</text><text x="493" y="249" font-family="Arial,sans-serif" font-size="15" fill="#334155">carries replacement ID</text><rect x="878" y="155" width="375" height="165" rx="12" fill="#eff6ff" stroke="#475569" stroke-width="2"/><rect x="878" y="155" width="375" height="42" rx="12" fill="#dbeafe"/><path d="M878 197 H1253" stroke="#475569"/><text x="1065.5" y="183" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#102a43">HTTP upload/delete routes</text><text x="896" y="225" font-family="Arial,sans-serif" font-size="15" fill="#334155">session + group scope</text><text x="896" y="249" font-family="Arial,sans-serif" font-size="15" fill="#334155">maps service failures</text><rect x="1281" y="155" width="375" height="165" rx="12" fill="#fefce8" stroke="#475569" stroke-width="2"/><rect x="1281" y="155" width="375" height="42" rx="12" fill="#dbeafe"/><path d="M1281 197 H1656" stroke="#475569"/><text x="1468.5" y="183" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#102a43">Contribution quota policy</text><text x="1299" y="225" font-family="Arial,sans-serif" font-size="15" fill="#334155">seven-day window</text><text x="1299" y="249" font-family="Arial,sans-serif" font-size="15" fill="#334155">five items / 30 s / 15 s max</text><rect x="72" y="385" width="375" height="165" rx="12" fill="#fff7ed" stroke="#475569" stroke-width="2"/><rect x="72" y="385" width="375" height="42" rx="12" fill="#dbeafe"/><path d="M72 427 H447" stroke="#475569"/><text x="259.5" y="413" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#102a43">Direct upload-intent service</text><text x="90" y="455" font-family="Arial,sans-serif" font-size="15" fill="#334155">version-pinned completion</text><text x="90" y="479" font-family="Arial,sans-serif" font-size="15" fill="#334155">same quota/job boundary</text><rect x="475" y="385" width="375" height="165" rx="12" fill="#fefce8" stroke="#475569" stroke-width="2"/><rect x="475" y="385" width="375" height="42" rx="12" fill="#dbeafe"/><path d="M475 427 H850" stroke="#475569"/><text x="662.5" y="413" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#102a43">SQLite contribution/job ledger</text><text x="493" y="455" font-family="Arial,sans-serif" font-size="15" fill="#334155">conditional reserve</text><text x="493" y="479" font-family="Arial,sans-serif" font-size="15" fill="#334155">tombstone + replacement link</text><rect x="878" y="385" width="375" height="165" rx="12" fill="#f5f3ff" stroke="#475569" stroke-width="2"/><rect x="878" y="385" width="375" height="42" rx="12" fill="#dbeafe"/><path d="M878 427 H1253" stroke="#475569"/><text x="1065.5" y="413" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#102a43">Media + FFmpeg boundary</text><text x="896" y="455" font-family="Arial,sans-serif" font-size="15" fill="#334155">accepted job processing</text><text x="896" y="479" font-family="Arial,sans-serif" font-size="15" fill="#334155">cleanup after commit</text><text x="72" y="666" font-family="Arial,sans-serif" font-size="14" fill="#475569">Solid arrows show a responsibility/use relationship. The intent and staged routes converge on the authoritative quota and job records.</text></svg>
