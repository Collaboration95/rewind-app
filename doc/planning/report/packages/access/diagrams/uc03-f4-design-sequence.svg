<text x="30" y="47" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="25px" font-weight="bold" fill="#17324d" word-spacing="1px" class="">UC03-F4 — Reject an unusable invitation — design sequence</text><text x="30" y="76" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="normal" fill="#536575" word-spacing="1px"><tspan x="30" dy="0">Current pilot implementation at 450a719; exception branches follow the request and persistence boundaries.</tspan></text><rect x="5.0" y="105" width="220" height="58" rx="8" fill="#eef4f8" stroke="#2b6f9f" stroke-width="2"/><text x="115.0" y="128" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="bold" fill="#17324d" word-spacing="1px"><tspan x="115.0" dy="0">Invited account</tspan></text><line x1="115.0" y1="163" x2="115.0" y2="597" stroke="#9aaab7" stroke-width="1.5" stroke-dasharray="6 6"/><rect x="317.5" y="105" width="220" height="58" rx="8" fill="#eef4f8" stroke="#2b6f9f" stroke-width="2"/><text x="427.5" y="128" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="bold" fill="#17324d" word-spacing="1px"><tspan x="427.5" dy="0">RealAccountGroupExperience</tspan></text><line x1="427.5" y1="163" x2="427.5" y2="597" stroke="#9aaab7" stroke-width="1.5" stroke-dasharray="6 6"/><rect x="630.0" y="105" width="220" height="58" rx="8" fill="#eef4f8" stroke="#2b6f9f" stroke-width="2"/><text x="740.0" y="128" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="bold" fill="#17324d" word-spacing="1px"><tspan x="740.0" dy="0">POST</tspan><tspan x="740.0" dy="17">/real/invites/accept</tspan></text><line x1="740.0" y1="163" x2="740.0" y2="597" stroke="#9aaab7" stroke-width="1.5" stroke-dasharray="6 6"/><rect x="942.5" y="105" width="220" height="58" rx="8" fill="#eef4f8" stroke="#2b6f9f" stroke-width="2"/><text x="1052.5" y="128" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="bold" fill="#17324d" word-spacing="1px"><tspan x="1052.5" dy="0">acceptRealGroupInvite()</tspan></text><line x1="1052.5" y1="163" x2="1052.5" y2="597" stroke="#9aaab7" stroke-width="1.5" stroke-dasharray="6 6"/><rect x="1255.0" y="105" width="220" height="58" rx="8" fill="#eef4f8" stroke="#2b6f9f" stroke-width="2"/><text x="1365.0" y="128" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="bold" fill="#17324d" word-spacing="1px"><tspan x="1365.0" dy="0">SQLite throttle +</tspan><tspan x="1365.0" dy="17">membership</tspan></text><line x1="1365.0" y1="163" x2="1365.0" y2="597" stroke="#9aaab7" stroke-width="1.5" stroke-dasharray="6 6"/><line x1="115.0" y1="191" x2="427.5" y2="191" stroke="#2b6f9f" stroke-width="2" marker-end="url(#arrowBlue)"/><rect x="121.25" y="166" width="300" height="22" fill="#ffffff" opacity="0.96"/><text x="271.25" y="182" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="normal" fill="#2b6f9f" word-spacing="1px"><tspan x="271.25" dy="0">Submit code or continue after sign-in</tspan></text><line x1="427.5" y1="251" x2="740.0" y2="251" stroke="#2b6f9f" stroke-width="2" marker-end="url(#arrowBlue)"/><rect x="433.75" y="226" width="300" height="22" fill="#ffffff" opacity="0.96"/><text x="583.75" y="242" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="normal" fill="#2b6f9f" word-spacing="1px"><tspan x="583.75" dy="0">POST code and optional groupId</tspan></text><line x1="740.0" y1="311" x2="1052.5" y2="311" stroke="#2b6f9f" stroke-width="2" marker-end="url(#arrowBlue)"/><rect x="746.25" y="286" width="300" height="39" fill="#ffffff" opacity="0.96"/><text x="896.25" y="302" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="normal" fill="#2b6f9f" word-spacing="1px"><tspan x="896.25" dy="0">401 if session missing/expired;</tspan><tspan x="896.25" dy="17">otherwise bind accountId</tspan></text><line x1="1052.5" y1="371" x2="1365.0" y2="371" stroke="#2b6f9f" stroke-width="2" marker-end="url(#arrowBlue)"/><rect x="1058.75" y="346" width="300" height="39" fill="#ffffff" opacity="0.96"/><text x="1208.75" y="362" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="normal" fill="#2b6f9f" word-spacing="1px"><tspan x="1208.75" dy="0">Persist attempt then validate</tspan><tspan x="1208.75" dy="17">normalized code</tspan></text><line x1="1365.0" y1="431" x2="1052.5" y2="431" stroke="#607487" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="1058.75" y="406" width="300" height="39" fill="#ffffff" opacity="0.96"/><text x="1208.75" y="422" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="normal" fill="#607487" word-spacing="1px"><tspan x="1208.75" dy="0">Check expiry, replay, group and</tspan><tspan x="1208.75" dy="17">capacity</tspan></text><line x1="1052.5" y1="491" x2="740.0" y2="491" stroke="#b34339" stroke-width="2" marker-end="url(#arrowRed)"/><rect x="746.25" y="466" width="300" height="22" fill="#ffffff" opacity="0.96"/><text x="896.25" y="482" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="normal" fill="#b34339" word-spacing="1px"><tspan x="896.25" dy="0">400/404/409/429 typed safe result</tspan></text><line x1="740.0" y1="551" x2="427.5" y2="551" stroke="#b34339" stroke-width="2" marker-end="url(#arrowRed)"/><rect x="433.75" y="526" width="300" height="22" fill="#ffffff" opacity="0.96"/><text x="583.75" y="542" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="normal" fill="#b34339" word-spacing="1px"><tspan x="583.75" dy="0">Show error; no partial membership</tspan></text><rect x="35" y="614" width="1410" height="86" rx="8" fill="#fbe9e7" stroke="#bd6458" stroke-width="1.5"/><text x="52" y="637" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="bold" fill="#8f3029" word-spacing="1px" class="">ALT / relevant exceptional branches</text><text x="58" y="659" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="13px" font-weight="normal" fill="#5f302c" word-spacing="1px"><tspan x="58" dy="0">Unauthenticated/expired session; malformed/unknown code; 10 guesses per account/source per 15-minute window; expired; accepted/replayed or duplicate;</tspan><tspan x="58" dy="16">cross-group; group full; transaction failure/rollback.</tspan></text><text x="34" y="711" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="12px" font-weight="normal" fill="#536575" word-spacing="1px"><tspan x="34" dy="0">['Expired codes are marked expired; rejected guess attempts persist. Failed join transaction does not leave partial membership.']</tspan></text></svg>
