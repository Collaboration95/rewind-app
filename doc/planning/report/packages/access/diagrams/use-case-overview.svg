<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" role="img" aria-label="Access use cases with account, owner, invitee and future provider">
<rect width="1000" height="800" fill="white"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#17324d}.heading{font-size:26px;font-weight:bold}.label{font-size:19px}.small{font-size:17px}.line{stroke:#607487;stroke-width:2;fill:none}</style>
<text x="30" y="45" class="heading" text-anchor="start">Access — pilot use cases and future identity boundary</text>
<text x="30" y="76" class="small" text-anchor="start">UC01–UC03 flow details and exception paths are catalogued separately.</text>
<rect x="310" y="108" width="440" height="560" rx="12" fill="#fbfdff" stroke="#17324d" stroke-width="2"/>
<text x="530" y="140" class="label" text-anchor="middle">Rewind access boundary</text>
<circle cx="120" cy="210" r="14" fill="none" stroke="#17324d" stroke-width="2"/>
<path d="M120,224 v42 m-25,-24 h50 m-25,24 l-22,30 m22,-30 l22,30" class="line"/>
<text x="120" y="318" class="small" text-anchor="middle">Account holder</text>
<circle cx="120" cy="440" r="14" fill="none" stroke="#17324d" stroke-width="2"/>
<path d="M120,454 v42 m-25,-24 h50 m-25,24 l-22,30 m22,-30 l22,30" class="line"/>
<text x="120" y="548" class="small" text-anchor="middle">Group owner</text>
<circle cx="880" cy="370" r="14" fill="none" stroke="#17324d" stroke-width="2"/>
<path d="M880,384 v42 m-25,-24 h50 m-25,24 l-22,30 m22,-30 l22,30" class="line"/>
<text x="880" y="478" class="small" text-anchor="middle">Invited account</text>
<circle cx="880" cy="560" r="14" fill="none" stroke="#17324d" stroke-width="2"/>
<path d="M880,574 v42 m-25,-24 h50 m-25,24 l-22,30 m22,-30 l22,30" class="line"/>
<text x="880" y="668" class="small" text-anchor="middle">Identity provider</text>
<text x="880" y="691" class="small" text-anchor="middle">Sprint 3 target</text>
<path d="M150 242 H250 V202 H340 M250 322 H340 M250 242 V322" class="line"/>
<path d="M150 472 H275 V322 H340 M275 442 H340" class="line"/>
<path d="M850 402 H795 V442 H720" class="line"/>
<path d="M850 592 H790 V590 H720" class="line" stroke-dasharray="7 5"/>
<ellipse cx="530" cy="202" rx="190" ry="48" fill="#eef4f8" stroke="#2b6f9f" stroke-width="2"/>
<text x="530" y="191" class="label" text-anchor="middle">UC01 Account / session</text>
<text x="530" y="214" class="label" text-anchor="middle">Register, sign in, restore, sign out</text>
<ellipse cx="530" cy="322" rx="190" ry="48" fill="#eef4f8" stroke="#2b6f9f" stroke-width="2"/>
<text x="530" y="311" class="label" text-anchor="middle">UC02 Private group</text>
<text x="530" y="334" class="label" text-anchor="middle">Create, select, settings/preferences</text>
<ellipse cx="530" cy="442" rx="190" ry="48" fill="#eef4f8" stroke="#2b6f9f" stroke-width="2"/>
<text x="530" y="431" class="label" text-anchor="middle">UC03 Invitation</text>
<text x="530" y="454" class="label" text-anchor="middle">Owner issue/revoke; invitee accept</text>
<ellipse cx="530" cy="590" rx="190" ry="48" fill="#fff6e4" stroke="#2b6f9f" stroke-width="2" stroke-dasharray="7 5"/>
<text x="530" y="579" class="label" text-anchor="middle">Future managed OIDC</text>
<text x="530" y="602" class="label" text-anchor="middle">Redirect, callback, cancel</text>
<rect x="30" y="720" width="940" height="58" rx="8" fill="#f1f2f4"/>
<text x="500" y="745" class="small" text-anchor="middle">Excluded: public discovery, owner transfer, member removal, leave/rejoin,</text>
<text x="500" y="768" class="small" text-anchor="middle">account deletion/recovery. Outsiders gain no private group authority.</text>
</svg>
