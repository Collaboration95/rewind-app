<text x="30" y="47" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="25px" font-weight="bold" fill="#17324d" word-spacing="1px" class="">Access use-case overview</text><text x="30" y="76" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="normal" fill="#536575" word-spacing="1px"><tspan x="30" dy="0">Current pilot cases are solid; OIDC target is dashed. Explicit exclusions are shown outside the boundary.</tspan></text><rect x="400" y="125" width="800" height="825" rx="12" fill="#fbfdff" stroke="#17324d" stroke-width="3"/><text x="420" y="157" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="bold" fill="#17324d" word-spacing="1px" class="">Rewind — access slice</text><circle cx="130" cy="330" r="16" fill="none" stroke="#17324d" stroke-width="3"/><line x1="130" y1="346" x2="130" y2="392" stroke="#17324d" stroke-width="3"/><line x1="105" y1="364" x2="155" y2="364" stroke="#17324d" stroke-width="3"/><line x1="130" y1="392" x2="107" y2="425" stroke="#17324d" stroke-width="3"/><line x1="130" y1="392" x2="153" y2="425" stroke="#17324d" stroke-width="3"/><text x="130" y="449" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="bold" fill="#17324d" word-spacing="1px"><tspan x="130" dy="0">Account holder</tspan></text><circle cx="130" cy="700" r="16" fill="none" stroke="#17324d" stroke-width="3"/><line x1="130" y1="716" x2="130" y2="762" stroke="#17324d" stroke-width="3"/><line x1="105" y1="734" x2="155" y2="734" stroke="#17324d" stroke-width="3"/><line x1="130" y1="762" x2="107" y2="795" stroke="#17324d" stroke-width="3"/><line x1="130" y1="762" x2="153" y2="795" stroke="#17324d" stroke-width="3"/><text x="130" y="819" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="bold" fill="#17324d" word-spacing="1px"><tspan x="130" dy="0">Group owner</tspan></text><circle cx="130" cy="865" r="16" fill="none" stroke="#17324d" stroke-width="3"/><line x1="130" y1="881" x2="130" y2="927" stroke="#17324d" stroke-width="3"/><line x1="105" y1="899" x2="155" y2="899" stroke="#17324d" stroke-width="3"/><line x1="130" y1="927" x2="107" y2="960" stroke="#17324d" stroke-width="3"/><line x1="130" y1="927" x2="153" y2="960" stroke="#17324d" stroke-width="3"/><text x="130" y="984" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="bold" fill="#17324d" word-spacing="1px"><tspan x="130" dy="0">Identity provider</tspan><tspan x="130" dy="17.92">(target)</tspan></text><circle cx="1330" cy="700" r="16" fill="none" stroke="#17324d" stroke-width="3"/><line x1="1330" y1="716" x2="1330" y2="762" stroke="#17324d" stroke-width="3"/><line x1="1305" y1="734" x2="1355" y2="734" stroke="#17324d" stroke-width="3"/><line x1="1330" y1="762" x2="1307" y2="795" stroke="#17324d" stroke-width="3"/><line x1="1330" y1="762" x2="1353" y2="795" stroke="#17324d" stroke-width="3"/><text x="1330" y="819" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="bold" fill="#17324d" word-spacing="1px"><tspan x="1330" dy="0">Invited account</tspan></text><ellipse cx="800" cy="190" rx="300" ry="32" fill="#e7f4eb" stroke="#2b6f9f" stroke-width="2"/><text x="800" y="195" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="normal" fill="#1c2935" word-spacing="1px"><tspan x="800" dy="0">UC01 Register account</tspan></text><ellipse cx="800" cy="268" rx="300" ry="32" fill="#e7f4eb" stroke="#2b6f9f" stroke-width="2"/><text x="800" y="273" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="normal" fill="#1c2935" word-spacing="1px"><tspan x="800" dy="0">UC01 Sign in / restore / sign out</tspan></text><ellipse cx="800" cy="346" rx="300" ry="32" fill="#eef4f8" stroke="#2b6f9f" stroke-width="2"/><text x="800" y="351" text-anchor="middle" font-family