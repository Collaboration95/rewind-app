<text x="30" y="47" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="25px" font-weight="bold" fill="#17324d" word-spacing="1px" class="">UC02-F4 — Save a member reminder preference — design sequence</text><text x="30" y="76" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="normal" fill="#536575" word-spacing="1px"><tspan x="30" dy="0">Current pilot implementation at fc2b8c81; exception branches follow request and persistence boundaries.</tspan></text><rect x="5.0" y="105" width="220" height="58" rx="8" fill="#eef4f8" stroke="#2b6f9f" stroke-width="2"/><text x="115.0" y="128" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="bold" fill="#17324d" word-spacing="1px"><tspan x="115.0" dy="0">Group member</tspan></text><line x1="115.0" y1="163" x2="115.0" y2="777" stroke="#9aaab7" stroke-width="1.5" stroke-dasharray="6 6"/><rect x="317.5" y="105" width="220" height="58" rx="8" fill="#eef4f8" stroke="#2b6f9f" stroke-width="2"/><text x="427.5" y="128" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="bold" fill="#17324d" word-spacing="1px"><tspan x="427.5" dy="0">RealGroupSettings</tspan></text><line x1="427.5" y1="163" x2="427.5" y2="777" stroke="#9aaab7" stroke-width="1.5" stroke-dasharray="6 6"/><rect x="630.0" y="105" width="220" height="58" rx="8" fill="#eef4f8" stroke="#2b6f9f" stroke-width="2"/><text x="740.0" y="128" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="bold" fill="#17324d" word-spacing="1px"><tspan x="740.0" dy="0">POST</tspan><tspan x="740.0" dy="17">/real/groups/:id/reminders</tspan></text><line x1="740.0" y1="163" x2="740.0" y2="777" stroke="#9aaab7" stroke-width="1.5" stroke-dasharray="6 6"/><rect x="942.5" y="105" width="220" height="58" rx="8" fill="#eef4f8" stroke="#2b6f9f" stroke-width="2"/><text x="1052.5" y="128" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="bold" fill="#17324d" word-spacing="1px"><tspan x="1052.5" dy="0">updateRealReminderPreference()</tspan></text><line x1="1052.5" y1="163" x2="1052.5" y2="777" stroke="#9aaab7" stroke-width="1.5" stroke-dasharray="6 6"/><rect x="1255.0" y="105" width="220" height="58" rx="8" fill="#eef4f8" stroke="#2b6f9f" stroke-width="2"/><text x="1365.0" y="128" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="bold" fill="#17324d" word-spacing="1px"><tspan x="1365.0" dy="0">Preference table +</tspan><tspan x="1365.0" dy="17">schedule</tspan></text><line x1="1365.0" y1="163" x2="1365.0" y2="777" stroke="#9aaab7" stroke-width="1.5" stroke-dasharray="6 6"/><line x1="115.0" y1="191" x2="427.5" y2="191" stroke="#2b6f9f" stroke-width="2" marker-end="url(#arrowBlue)"/><rect x="121.25" y="166" width="300" height="22" fill="#ffffff" opacity="0.96"/><text x="271.25" y="182" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="normal" fill="#2b6f9f" word-spacing="1px"><tspan x="271.25" dy="0">Toggle my reminder or choose snooze</tspan></text><line x1="427.5" y1="251" x2="740.0" y2="251" stroke="#2b6f9f" stroke-width="2" marker-end="url(#arrowBlue)"/><rect x="433.75" y="226" width="300" height="22" fill="#ffffff" opacity="0.96"/><text x="583.75" y="242" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="normal" fill="#2b6f9f" word-spacing="1px"><tspan x="583.75" dy="0">POST enabled + snoozedUntil</tspan></text><line x1="740.0" y1="311" x2="1052.5" y2="311" stroke="#2b6f9f" stroke-width="2" marker-end="url(#arrowBlue)"/><rect x="746.25" y="286" width="300" height="39" fill="#ffffff" opacity="0.96"/><text x="896.25" y="302" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="normal" fill="#2b6f9f" word-spacing="1px"><tspan x="896.25" dy="0">Validate session, route body and group</tspan><tspan x="896.25" dy="17">membership</tspan></text><path d="M1052.5 371 h42 v24 h-36" fill="none" stroke="#2b6f9f" stroke-width="2" marker-end="url(#arrowBlue)"/><rect x="1098.5" y="346" width="260" height="22" fill="#ffffff" opacity="0.96"/><text x="1101.5" y="362" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="normal" fill="#2b6f9f" word-spacing="1px"><tspan x="1101.5" dy="0">Validate boolean and snooze window</tspan></text><path d="M1052.5 431 h42 v24 h-36" fill="none" stroke="#2b6f9f" stroke-width="2" marker-end="url(#arrowBlue)"/><rect x="1098.5" y="406" width="260" height="22" fill="#ffffff" opacity="0.96"/><text x="1101.5" y="422" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="normal" fill="#2b6f9f" word-spacing="1px"><tspan x="1101.5" dy="0">BEGIN; upsert preference; COMMIT</tspan></text><line x1="1052.5" y1="491" x2="1365.0" y2="491" stroke="#2b6f9f" stroke-width="2" marker-end="url(#arrowBlue)"/><rect x="1058.75" y="466" width="300" height="39" fill="#ffffff" opacity="0.96"/><text x="1208.75" y="482" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="normal" fill="#2b6f9f" word-spacing="1px"><tspan x="1208.75" dy="0">Compute next Sunday 19:00 in group IANA</tspan><tspan x="1208.75" dy="17">zone</tspan></text><line x1="1365.0" y1="551" x2="1052.5" y2="551" stroke="#607487" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="1058.75" y="526" width="300" height="39" fill="#ffffff" opacity="0.96"/><text x="1208.75" y="542" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="normal" fill="#607487" word-spacing="1px"><tspan x="1208.75" dy="0">Schedule result; delivery</tspan><tspan x="1208.75" dy="17">not-configured</tspan></text><line x1="1052.5" y1="611" x2="740.0" y2="611" stroke="#607487" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="746.25" y="586" width="300" height="22" fill="#ffffff" opacity="0.96"/><text x="896.25" y="602" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="normal" fill="#607487" word-spacing="1px"><tspan x="896.25" dy="0">Return saved state or safe 400/403</tspan></text><line x1="740.0" y1="671" x2="427.5" y2="671" stroke="#607487" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="433.75" y="646" width="300" height="22" fill="#ffffff" opacity="0.96"/><text x="583.75" y="662" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="normal" fill="#607487" word-spacing="1px"><tspan x="583.75" dy="0">Update panel; no notification sent</tspan></text><line x1="427.5" y1="731" x2="115.0" y2="731" stroke="#607487" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="121.25" y="706" width="300" height="22" fill="#ffffff" opacity="0.96"/><text x="271.25" y="722" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="normal" fill="#607487" word-spacing="1px"><tspan x="271.25" dy="0">Show saved preference</tspan></text><rect x="35" y="794" width="1410" height="86" rx="8" fill="#fbe9e7" stroke="#bd6458" stroke-width="1.5"/><text x="52" y="817" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="bold" fill="#8f3029" word-spacing="1px" class="">ALT / relevant exceptional branches</text><text x="58" y="839" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="13px" font-weight="normal" fill="#5f302c" word-spacing="1px"><tspan x="58" dy="0">Unknown/non-member group is forbidden; malformed preference or invalid/past/&gt;31-day snooze rejected; persistence/schedule error does not claim</tspan><tspan x="58" dy="16">delivery.</tspan></text><text x="34" y="891" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="12px" font-weight="normal" fill="#536575" word-spacing="1px"><tspan x="34" dy="0">['Preference is member-specific; GET exposes schedule and delivery.state=not-configured. Saving a preference does not send a notification.']</tspan></text></svg>
