oke-width="2"/><text x="1365.0" y="128" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="bold" fill="#17324d" word-spacing="1px"><tspan x="1365.0" dy="0">Invite service / store</tspan></text><line x1="1365.0" y1="163" x2="1365.0" y2="537" stroke="#9aaab7" stroke-width="1.5" stroke-dasharray="6 6"/><line x1="115.0" y1="191" x2="531.6666666666667" y2="191" stroke="#2b6f9f" stroke-width="2" marker-end="url(#arrowBlue)"/><rect x="173.33333333333337" y="166" width="300" height="22" fill="#ffffff" opacity="0.96"/><text x="323.33333333333337" y="182" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="normal" fill="#2b6f9f" word-spacing="1px"><tspan x="323.33333333333337" dy="0">Submit code or arrive without valid session</tspan></text><line x1="531.6666666666667" y1="251" x2="948.3333333333334" y2="251" stroke="#2b6f9f" stroke-width="2" marker-end="url(#arrowBlue)"/><rect x="590.0" y="226" width="300" height="22" fill="#ffffff" opacity="0.96"/><text x="740.0" y="242" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="normal" fill="#2b6f9f" word-spacing="1px"><tspan x="740.0" dy="0">Request acceptance</tspan></text><line x1="948.3333333333334" y1="311" x2="1365.0" y2="311" stroke="#2b6f9f" stroke-width="2" marker-end="url(#arrowBlue)"/><rect x="1006.6666666666667" y="286" width="300" height="39" fill="#ffffff" opacity="0.96"/><text x="1156.6666666666667" y="302" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="normal" fill="#2b6f9f" word-spacing="1px"><tspan x="1156.6666666666667" dy="0">Validate account session; record attempt if</tspan><tspan x="1156.6666666666667" dy="17">authenticated</tspan></text><path d="M1365.0 371 h42 v24 h-36" fill="none" stroke="#2b6f9f" stroke-width="2" marker-end="url(#arrowBlue)"/><rect x="1411.0" y="346" width="260" height="56" fill="#ffffff" opacity="0.96"/><text x="1414.0" y="362" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="normal" fill="#2b6f9f" word-spacing="1px"><tspan x="1414.0" dy="0">Normalize code; check status,</tspan><tspan x="1414.0" dy="17">expiry, group, duplicate and</tspan><tspan x="1414.0" dy="17">capacity</tspan></text><line x1="1365.0" y1="431" x2="948.3333333333334" y2="431" stroke="#b34339" stroke-width="2" marker-end="url(#arrowRed)"/><rect x="1006.6666666666667" y="406" width="300" height="22" fill="#ffffff" opacity="0.96"/><text x="1156.6666666666667" y="422" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="normal" fill="#b34339" word-spacing="1px"><tspan x="1156.6666666666667" dy="0">Return typed denial; do not create membership</tspan></text><line x1="948.3333333333334" y1="491" x2="531.6666666666667" y2="491" stroke="#b34339" stroke-width="2" marker-end="url(#arrowRed)"/><rect x="590.0" y="466" width="300" height="22" fill="#ffffff" opacity="0.96"/><text x="740.0" y="482" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="normal" fill="#b34339" word-spacing="1px"><tspan x="740.0" dy="0">Show safe error / sign-in requirement</tspan></text><rect x="35" y="554" width="1410" height="86" rx="8" fill="#fbe9e7" stroke="#bd6458" stroke-width="1.5"/><text x="52" y="577" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="bold" fill="#8f3029" word-spacing="1px" class="">ALT / relevant exceptional branches</text><text x="58" y="599" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="13px" font-weight="normal" fill="#5f302c" word-spacing="1px"><tspan x="58" dy="0">Unauthenticated/expired session; malformed/unknown code; 10 guesses per account/source per 15-minute window; expired; accepted/replayed or duplicate;</tspan><tspan x="58" dy="16">cross-group; group full; transaction failure/rollback.</tspan></text><text x="34" y="651" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="12px" font-weight="normal" fill="#536575" word-spacing="1px"><tspan x="34" dy="0">Analysis view; implementation names are deliberately omitted.</tspan></text></svg>
