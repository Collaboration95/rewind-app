<text x="30" y="47" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="25px" font-weight="bold" fill="#17324d" word-spacing="1px" class="">UC02-F1 — Create a group — design sequence</text><text x="30" y="76" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="normal" fill="#536575" word-spacing="1px"><tspan x="30" dy="0">Current pilot implementation at a6b6b312; exception branches follow request and persistence boundaries.</tspan></text><rect x="5.0" y="105" width="220" height="58" rx="8" fill="#eef4f8" stroke="#2b6f9f" stroke-width="2"/><text x="115.0" y="128" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="bold" fill="#17324d" word-spacing="1px"><tspan x="115.0" dy="0">Group owner</tspan></text><line x1="115.0" y1="163" x2="115.0" y2="597" stroke="#9aaab7" stroke-width="1.5" stroke-dasharray="6 6"/><rect x="317.5" y="105" width="220" height="58" rx="8" fill="#eef4f8" stroke="#2b6f9f" stroke-width="2"/><text x="427.5" y="128" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="bold" fill="#17324d" word-spacing="1px"><tspan x="427.5" dy="0">RealAccountGroupExperience</tspan></text><line x1="427.5" y1="163" x2="427.5" y2="597" stroke="#9aaab7" stroke-width="1.5" stroke-dasharray="6 6"/><rect x="630.0" y="105" width="220" height="58" rx="8" fill="#eef4f8" stroke="#2b6f9f" stroke-width="2"/><text x="740.0" y="128" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="bold" fill="#17324d" word-spacing="1px"><tspan x="740.0" dy="0">POST /real/groups</tspan></text><line x1="740.0" y1="163" x2="740.0" y2="597" stroke="#9aaab7" stroke-width="1.5" stroke-dasharray="6 6"/><rect x="942.5" y="105" width="220" height="58" rx="8" fill="#eef4f8" stroke="#2b6f9f" stroke-width="2"/><text x="1052.5" y="128" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="bold" fill="#17324d" word-spacing="1px"><tspan x="1052.5" dy="0">createRealGroup()</tspan></text><line x1="1052.5" y1="163" x2="1052.5" y2="597" stroke="#9aaab7" stroke-width="1.5" stroke-dasharray="6 6"/><rect x="1255.0" y="105" width="220" height="58" rx="8" fill="#eef4f8" stroke="#2b6f9f" stroke-width="2"/><text x="1365.0" y="128" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="bold" fill="#17324d" word-spacing="1px"><tspan x="1365.0" dy="0">SQLite group tables</tspan></text><line x1="1365.0" y1="163" x2="1365.0" y2="597" stroke="#9aaab7" stroke-width="1.5" stroke-dasharray="6 6"/><line x1="115.0" y1="191" x2="427.5" y2="191" stroke="#2b6f9f" stroke-width="2" marker-end="url(#arrowBlue)"/><rect x="121.25" y="166" width="300" height="22" fill="#ffffff" opacity="0.96"/><text x="271.25" y="182" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="normal" fill="#2b6f9f" word-spacing="1px"><tspan x="271.25" dy="0">Submit name, prompt and member limit</tspan></text><line x1="427.5" y1="251" x2="740.0" y2="251" stroke="#2b6f9f" stroke-width="2" marker-end="url(#arrowBlue)"/><rect x="433.75" y="226" width="300" height="22" fill="#ffffff" opacity="0.96"/><text x="583.75" y="242" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="normal" fill="#2b6f9f" word-spacing="1px"><tspan x="583.75" dy="0">POST /real/groups (UI omits timeZone)</tspan></text><line x1="740.0" y1="311" x2="1052.5" y2="311" stroke="#2b6f9f" stroke-width="2" marker-end="url(#arrowBlue)"/><rect x="746.25" y="286" width="300" height="39" fill="#ffffff" opacity="0.96"/><text x="896.25" y="302" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="normal" fill="#2b6f9f" word-spacing="1px"><tspan x="896.25" dy="0">Validate session, fields and optional</tspan><tspan x="896.25" dy="17">IANA timeZone; default UTC</tspan></text><line x1="1052.5" y1="371" x2="1365.0" y2="371" stroke="#2b6f9f" stroke-width="2" marker-end="url(#arrowBlue)"/><rect x="1058.75" y="346" width="300" height="39" fill="#ffffff" opacity="0.96"/><text x="1208.75" y="362" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="normal" fill="#2b6f9f" word-spacing="1px"><tspan x="1208.75" dy="0">BEGIN IMMEDIATE; write</tspan><tspan x="1208.75" dy="17">group/timeZone/cycle/member/selection</tspan></text><line x1="1365.0" y1="431" x2="1052.5" y2="431" stroke="#607487" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="1058.75" y="406" width="300" height="22" fill="#ffffff" opacity="0.96"/><text x="1208.75" y="422" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="normal" fill="#607487" word-spacing="1px"><tspan x="1208.75" dy="0">COMMIT or ROLLBACK</tspan></text><line x1="1052.5" y1="491" x2="740.0" y2="491" stroke="#607487" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="746.25" y="466" width="300" height="22" fill="#ffffff" opacity="0.96"/><text x="896.25" y="482" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="normal" fill="#607487" word-spacing="1px"><tspan x="896.25" dy="0">201 group or 400/409</tspan></text><line x1="740.0" y1="551" x2="427.5" y2="551" stroke="#607487" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="433.75" y="526" width="300" height="39" fill="#ffffff" opacity="0.96"/><text x="583.75" y="542" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="normal" fill="#607487" word-spacing="1px"><tspan x="583.75" dy="0">Show group, UTC zone, or validation</tspan><tspan x="583.75" dy="17">error</tspan></text><rect x="35" y="614" width="1410" height="86" rx="8" fill="#fbe9e7" stroke="#bd6458" stroke-width="1.5"/><text x="52" y="637" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="bold" fill="#8f3029" word-spacing="1px" class="">ALT / relevant exceptional branches</text><text x="58" y="659" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="13px" font-weight="normal" fill="#5f302c" word-spacing="1px"><tspan x="58" dy="0">Missing session; malformed body; invalid field/member cap or IANA timezone; persistence error rolls back. UI omits timezone and receives UTC default;</tspan><tspan x="58" dy="16">API callers may supply a valid zone.</tspan></text><text x="34" y="711" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="12px" font-weight="normal" fill="#536575" word-spacing="1px"><tspan x="34" dy="0">['Creation stores group time_zone with group/cycle/membership/selection in one transaction. The UI sends no timezone; the service defaults to UTC.']</tspan></text></svg>
