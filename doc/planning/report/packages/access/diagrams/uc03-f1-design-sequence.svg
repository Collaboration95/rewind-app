x1="1052.5" y1="371" x2="1365.0" y2="371" stroke="#2b6f9f" stroke-width="2" marker-end="url(#arrowBlue)"/><rect x="1058.75" y="346" width="300" height="22" fill="#ffffff" opacity="0.96"/><text x="1208.75" y="362" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="normal" fill="#2b6f9f" word-spacing="1px"><tspan x="1208.75" dy="0">Check role + owner_account_id + TTL</tspan></text><line x1="1365.0" y1="431" x2="1052.5" y2="431" stroke="#2b6f9f" stroke-width="2" marker-end="url(#arrowBlue)"/><rect x="1058.75" y="406" width="300" height="39" fill="#ffffff" opacity="0.96"/><text x="1208.75" y="422" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="normal" fill="#2b6f9f" word-spacing="1px"><tspan x="1208.75" dy="0">Insert unique random code within</tspan><tspan x="1208.75" dy="17">transaction</tspan></text><line x1="1052.5" y1="491" x2="740.0" y2="491" stroke="#607487" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="746.25" y="466" width="300" height="22" fill="#ffffff" opacity="0.96"/><text x="896.25" y="482" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="normal" fill="#607487" word-spacing="1px"><tspan x="896.25" dy="0">201 invite or 403/404/400/409</tspan></text><line x1="740.0" y1="551" x2="427.5" y2="551" stroke="#607487" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="433.75" y="526" width="300" height="22" fill="#ffffff" opacity="0.96"/><text x="583.75" y="542" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="normal" fill="#607487" word-spacing="1px"><tspan x="583.75" dy="0">Show code/expiry or safe error</tspan></text><rect x="35" y="614" width="1410" height="86" rx="8" fill="#fbe9e7" stroke="#bd6458" stroke-width="1.5"/><text x="52" y="637" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="bold" fill="#8f3029" word-spacing="1px" class="">ALT / relevant exceptional branches</text><text x="58" y="659" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="13px" font-weight="normal" fill="#5f302c" word-spacing="1px"><tspan x="58" dy="0">Not found; caller is not the recorded owner; TTL outside 5 minutes–7 days; persistence or bounded unique-code allocation failure. Default TTL is 24</tspan><tspan x="58" dy="16">hours.</tspan></text><text x="34" y="711" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="12px" font-weight="normal" fill="#536575" word-spacing="1px"><tspan x="34" dy="0">['Code allocation retries uniqueness conflicts up to eight times; UI link uses code and bounded expiry.']</tspan></text></svg>
