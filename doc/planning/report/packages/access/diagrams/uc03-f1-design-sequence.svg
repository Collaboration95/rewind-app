<text x="30" y="47" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="25px" font-weight="bold" fill="#17324d" word-spacing="1px" class="">UC03-F1 — Create an invitation — design sequence</text><text x="30" y="76" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="normal" fill="#536575" word-spacing="1px"><tspan x="30" dy="0">Current pilot implementation at a6b6b312; exception branches follow request and persistence boundaries.</tspan></text><rect x="5.0" y="105" width="220" height="58" rx="8" fill="#eef4f8" stroke="#2b6f9f" stroke-width="2"/><text x="115.0" y="128" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="bold" fill="#17324d" word-spacing="1px"><tspan x="115.0" dy="0">Group owner</tspan></text><line x1="115.0" y1="163" x2="115.0" y2="597" stroke="#9aaab7" stroke-width="1.5" stroke-dasharray="6 6"/><rect x="317.5" y="105" width="220" height="58" rx="8" fill="#eef4f8" stroke="#2b6f9f" stroke-width="2"/><text x="427.5" y="128" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="bold" fill="#17324d" word-spacing="1px"><tspan x="427.5" dy="0">RealAccountGroupExperience</tspan></text><line x1="427.5" y1="163" x2="427.5" y2="597" stroke="#9aaab7" stroke-width="1.5" stroke-dasharray="6 6"/><rect x="630.0" y="105" width="220" height="58" rx="8" fill="#eef4f8" stroke="#2b6f9f" stroke-width="2"/><text x="740.0" y="128" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="bold" fill="#17324d" word-spacing="1px"><tspan x="740.0" dy="0">POST</tspan><tspan x="740.0" dy="17">/real/groups/:id/invites</tspan></text><line x1="740.0" y1="163" x2="740.0" y2="597" stroke="#9aaab7" stroke-width="1.5" stroke-dasharray="6 6"/><rect x="942.5" y="105" width="220" height="58" rx="8" fill="#eef4f8" stroke="#2b6f9f" stroke-width="2"/><text x="1052.5" y="128" text-anchor="middle" font-family="Arial