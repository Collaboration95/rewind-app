 x="58" y="659" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="13px" font-weight="normal" fill="#5f302c" word-spacing="1px"><tspan x="58" dy="0">Non-owner/unknown group is forbidden; invalid prompt or timezone rejected; closed/ended cycle rejected; persistence failure rolls back. Existing next</tspan><tspan x="58" dy="16">cycles copy the edited prompt when created.</tspan></text><text x="34" y="711" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="12px" font-weight="normal" fill="#536575" word-spacing="1px"><tspan x="34" dy="0">Analysis view; implementation names are deliberately omitted.</tspan></text></svg>
