nt-size="14px" font-weight="bold" fill="#17324d" word-spacing="1px"><tspan x="1052.5" dy="0">Preference service /</tspan><tspan x="1052.5" dy="17">store</tspan></text><line x1="1052.5" y1="163" x2="1052.5" y2="717" stroke="#9aaab7" stroke-width="1.5" stroke-dasharray="6 6"/><rect x="1255.0" y="105" width="220" height="58" rx="8" fill="#eef4f8" stroke="#2b6f9f" stroke-width="2"/><text x="1365.0" y="128" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="bold" fill="#17324d" word-spacing="1px"><tspan x="1365.0" dy="0">Schedule calculator</tspan></text><line x1="1365.0" y1="163" x2="1365.0" y2="717" stroke="#9aaab7" stroke-width="1.5" stroke-dasharray="6 6"/><line x1="115.0" y1="191" x2="427.5" y2="191" stroke="#2b6f9f" stroke-width="2" marker-end="url(#arrowBlue)"/><rect x="121.25" y="166" width="300" height="39" fill="#ffffff" opacity="0.96"/><text x="271.25" y="182" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="normal" fill="#2b6f9f" word-spacing="1px"><tspan x="271.25" dy="0">Enable/disable personal reminders or</tspan><tspan x="271.25" dy="17">snooze</tspan></text><line x1="427.5" y1="251" x2="740.0" y2="251" stroke="#2b6f9f" stroke-width="2" marker-end="url(#arrowBlue)"/><rect x="433.75" y="226" width="300" height="22" fill="#ffffff" opacity="0.96"/><text x="583.75" y="242" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="normal" fill="#2b6f9f" word-spacing="1px"><tspan x="583.75" dy="0">Submit group-scoped preference</tspan></text><line x1="740.0" y1="311" x2="1052.5" y2="311" stroke="#2b6f9f" stroke-width="2" marker-end="url(#arrowBlue)"/><rect x="746.25" y="286" width="300" height="39" fill="#ffffff" opacity="0.96"/><text x="896.25" y="302" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="normal" fill="#2b6f9f" word-spacing="1px"><tspan x="896.25" dy="0">Resolve account from session; require</tspan><tspan x="896.25" dy="17">membership</tspan></text><path d="M1052.5 371 h42 v24 h-36" fill="none" stroke="#2b6f9f" stroke-width="2" marker-end="url(#arrowBlue)"/><rect x="1098.5" y="346" width="260" height="39" fill="#ffffff" opacity="0.96"/><text x="1101.5" y="362" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="normal" fill="#2b6f9f" word-spacing="1px"><tspan x="1101.5" dy="0">Validate enabled and optional</tspan><tspan x="1101.5" dy="17">snooze up to 31 days</tspan></text><path d="M1052.5 431 h42 v24 h-36" fill="none" stroke="#2b6f9f" stroke-width="2" marker-end="url(#arrowBlue)"/><rect x="1098.5" y="406" width="260" height="39" fill="#ffffff" opacity="0.96"/><text x="1101.5" y="422" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="normal" fill="#2b6f9f" word-spacing="1px"><tspan x="1101.5" dy="0">Upsert preference by group +</tspan><tspan x="1101.5" dy="17">account</tspan></text><line x1="1052.5" y1="491" x2="1365.0" y2="491" stroke="#2b6f9f" stroke-width="2" marker-end="url(#arrowBlue)"/><rect x="1058.75" y="466" width="300" height="39" fill="#ffffff" opacity="0.96"/><text x="1208.75" y="482" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="normal" fill="#2b6f9f" word-spacing="1px"><tspan x="1208.75" dy="0">Calculate next Sunday 19:00 in group</tspan><tspan x="1208.75" dy="17">timezone</tspan></text><line x1="1365.0" y1="551" x2="1052.5" y2="551" stroke="#607487" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="1058.75" y="526" width="300" height="22" fill="#ffffff" opacity="0.96"/><text x="1208.75" y="542" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="normal" fill="#607487" word-spacing="1px"><tspan x="1208.75" dy="0">Schedule result; delivery unconfigured</tspan></text><line x1="1052.5" y1="611" x2="740.0" y2="611" stroke="#607487" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="746.25" y="586" width="300" height="39" fill="#ffffff" opacity="0.96"/><text x="896.25" y="602" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="normal" fill="#607487" word-spacing="1px"><tspan x="896.25" dy="0">Return saved preference and delivery</tspan><tspan x="896.25" dy="17">state</tspan></text><line x1="740.0" y1="671" x2="427.5" y2="671" stroke="#607487" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="433.75" y="646" width="300" height="22" fill="#ffffff" opacity="0.96"/><text x="583.75" y="662" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="normal" fill="#607487" word-spacing="1px"><tspan x="583.75" dy="0">Display schedule; no notification sent</tspan></text><rect x="35" y="734" width="1410" height="86" rx="8" fill="#fbe9e7" stroke="#bd6458" stroke-width="1.5"/><text x="52" y="757" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="bold" fill="#8f3029" word-spacing="1px" class="">ALT / relevant exceptional branches</text><text x="58" y="779" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="13px" font-weight="normal" fill="#5f302c" word-spacing="1px"><tspan x="58" dy="0">Unknown/non-member group is forbidden; malformed preference or invalid/past/&gt;31-day snooze rejected; persistence/schedule error does not claim</tspan><tspan x="58" dy="16">delivery.</tspan></text><text x="34" y="831" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="12px" font-weight="normal" fill="#536575" word-spacing="1px"><tspan x="34" dy="0">Analysis view; implementation names are deliberately omitted.</tspan></text></svg>
