<svg xmlns="http://www.w3.org/2000/svg" width="1500px" height="760px" viewBox="0 0 1500 760" role="img" aria-label="After class model — actual transport and persisted boundaries"><title>After class model — actual transport and persisted boundaries</title><desc>Actual modules and data boundaries separate chat event replay from reminder jobs.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#286b93"/></marker><marker id="dash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#66798b"/></marker></defs><rect width="100%" height="100%" fill="#fff"/>
<text x="34" y="42" font-family="Arial" font-size="25" font-weight="bold" fill="#17324d">After — actual transport and persisted boundaries</text>
<text x="34" y="72" font-family="Arial" font-size="14" fill="#536575">Source-backed functions/modules; no fabricated pattern classes.</text>
<rect x="35" y="150" width="430" height="150" rx="10" fill="#eef4f8" stroke="#2b6f9f" stroke-width="2"/><text x="250" y="185" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold">Chat client + SSE</text><text x="250" y="220" text-anchor="middle" font-family="Arial" font-size="14">RealtimeChatClient · authorized stream · cursor</text><text x="250" y="250" text-anchor="middle" font-family="Arial" font-size="14">message drafts · reconnect · access recheck</text>
<rect x="535" y="150" width="430" height="150" rx="10" fill="#e8f4ef" stroke="#35836b" stroke-width="2"/><text x="750" y="185" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold">SQLite chat event log</text><text x="750" y="220" text-anchor="middle" font-family="Arial" font-size="14">messages · reactions · realtime_events</text><text x="750" y="250" text-anchor="middle" font-family="Arial" font-size="14">atomic send · watermark replay</text>
<rect x="1035" y="150" width="430" height="150" rx="10" fill="#fff8e7" stroke="#ac7e22" stroke-width="2"/><text x="1250" y="185" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold">Reminder outbox</text><text x="1250" y="220" text-anchor="middle" font-family="Arial" font-size="14">preference · destination generation · unique weekly job</text><text x="1250" y="250" text-anchor="middle" font-family="Arial" font-size="14">lease · attempts · receipt/status</text>
<line x1="465" y1="225" x2="525" y2="225" stroke="#286b93" stroke-width="2" marker-end="url(#arr)"/><text x="495" y="211" text-anchor="middle" font-family="Arial" font-size="12">persist</text>
<rect x="1035" y="430" width="430" height="140" rx="10" fill="#f0eef8" stroke="#75649d" stroke-width="2"/><text x="1250" y="468" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold">Expo / Web Push provider functions</text><text x="1250" y="505" text-anchor="middle" font-family="Arial" font-size="14">send outcome · optional receipt polling</text><text x="1250" y="535" text-anchor="middle" font-family="Arial" font-size="14">called outside queue transaction; fenced on return</text>
<line x1="1250" y1="300" x2="1250" y2="420" stroke="#286b93" stroke-width="2" marker-end="url(#arr)"/><text x="1335" y="365" font-family="Arial" font-size="12">lease + recheck</text>
<line x1="35" y1="620" x2="1465" y2="620" stroke="#8394a3" stroke-width="1.5"/><text x="35" y="654" font-family="Arial" font-size="17" font-weight="bold" fill="#17324d">Evidence boundary (caption)</text><text x="35" y="682" font-family="Arial" font-size="14" fill="#344d62">Chat: persisted message event + authorized replay. Reminder: consent-scoped job + provider outcome.</text><text x="35" y="710" font-family="Arial" font-size="14" fill="#344d62">Provider acceptance/receipt does not prove OS presentation or human observation.</text>
</svg>