<svg xmlns="http://www.w3.org/2000/svg" width="1500px" height="700px" viewBox="0 0 1500 700" role="img" aria-label="Before sequence — pattern-only async composition"><title>Before sequence — pattern-only async composition</title><desc>Conceptual before sequence intentionally shows the failure to distinguish live events and durable notifications.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#286b93"/></marker><marker id="dash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#66798b"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="34" y="42" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="bold" fill="#17324d"><tspan x="34" dy="0">Before — pattern-only asynchronous request</tspan></text><text x="34" y="72" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" fill="#536575"><tspan x="34" dy="0">Conceptual anti-pattern; no invented application class is asserted.</tspan></text><rect x="80" y="105" width="320" height="60" rx="8" fill="#fff2ee" stroke="#bd6458" stroke-width="2"/><text x="240" y="141" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold" fill="#8f3029"><tspan x="240" dy="0">Member action</tspan></text><line x1="240" y1="165" x2="240" y2="580" stroke="#a7b5c1" stroke-dasharray="6 6"/><rect x="590" y="105" width="320" height="60" rx="8" fill="#fff2ee" stroke="#bd6458" stroke-width="2"/><text x="750" y="141" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold" fill="#8f3029"><tspan x="750" dy="0">Generic observer</tspan></text><line x1="750" y1="165" x2="750" y2="580" stroke="#a7b5c1" stroke-dasharray="6 6"/><rect x="1100" y="105" width="320" height="60" rx="8" fill="#fff2ee" stroke="#bd6458" stroke-width="2"/><text x="1260" y="141" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold" fill="#8f3029"><tspan x="1260" dy="0">Provider / stream</tspan></text><line x1="1260" y1="165" x2="1260" y2="580" stroke="#a7b5c1" stroke-dasharray="6 6"/><line x1="248" y1="180" x2="742" y2="180" stroke="#bd6458" stroke-width="2" marker-end="url(#arr)"/><rect x="289.0" y="182" width="412" height="20" fill="#fff" opacity="0.97"/><text x="495.0" y="197" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" fill="#8f3029"><tspan x="495.0" dy="0">Emit chat or reminder intent</tspan></text><line x1="758" y1="262" x2="1252" y2="262" stroke="#bd6458" stroke-width="2" marker-end="url(#arr)"/><rect x="790.0" y="264" width="430" height="20" fill="#fff" opacity="0.97"/><text x="1005.0" y="279" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" fill="#8f3029"><tspan x="1005.0" dy="0">Call subscriber/provider directly</tspan></text><line x1="1268" y1="344" x2="742" y2="344" stroke="#bd6458" stroke-width="2" marker-end="url(#arr)"/><rect x="790.0" y="346" width="430" height="20" fill="#fff" opacity="0.97"/><text x="1005.0" y="361" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" fill="#8f3029"><tspan x="1005.0" dy="0">Return ambiguous “sent” outcome</tspan></text><line x1="758" y1="426" x2="232" y2="426" stroke="#bd6458" stroke-width="2" marker-end="url(#arr)"/><rect x="280.0" y="428" width="430" height="20" fill="#fff" opacity="0.97"/><text x="495.0" y="443" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" fill="#8f3029"><tspan x="495.0" dy="0">No durable replay, lease or receipt truth</tspan></text></svg>