<svg xmlns="http://www.w3.org/2000/svg" width="1600px" height="820px" viewBox="0 0 1600 820" role="img" aria-label="After sequence — chat replay and durable reminder delivery"><title>After sequence — chat replay and durable reminder delivery</title><desc>Actual SSE event replay is separate from leased durable provider delivery.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#286b93"/></marker><marker id="dash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#66798b"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="34" y="42" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="bold" fill="#17324d"><tspan x="34" dy="0">After — actual chat replay and reminder delivery</tspan></text><text x="34" y="72" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" fill="#536575"><tspan x="34" dy="0">Two independent paths; provider return is persisted as an outcome, not assumed device display.</tspan></text><rect x="20" y="105" width="260" height="60" rx="8" fill="#eef4f8" stroke="#2b6f9f" stroke-width="2"/><text x="150" y="141" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" fill="#17324d"><tspan x="150" dy="0">Chat client</tspan></text><line x1="150" y1="165" x2="150" y2="760" stroke="#a7b5c1" stroke-dasharray="6 6"/><rect x="345" y="105" width="260" height="60" rx="8" fill="#eef4f8" stroke="#2b6f9f" stroke-width="2"/><text x="475" y="141" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" fill="#17324d"><tspan x="475" dy="0">HTTP / SSE</tspan></text><line x1="475" y1="165" x2="475" y2="760" stroke="#a7b5c1" stroke-dasharray="6 6"/><rect x="670" y="105" width="260" height="60" rx="8" fill="#eef4f8" stroke="#2b6f9f" stroke-width="2"/><text x="800" y="141" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" fill="#17324d"><tspan x="800" dy="0">SQLite chat log</tspan></text><line x1="800" y1="165" x2="800" y2="760" stroke="#a7b5c1" stroke-dasharray="6 6"/><rect x="995" y="105" width="260" height="60" rx="8" fill="#eef4f8" stroke="#2b6f9f" stroke-width="2"/><text x="1125" y="141" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" fill="#17324d"><tspan x="1125" dy="0">reminders --once CLI</tspan></text><line x1="1125" y1="165" x2="1125" y2="760" stroke="#a7b5c1" stroke-dasharray="6 6"/><rect x="1320" y="105" width="260" height="60" rx="8" fill="#eef4f8" stroke="#2b6f9f" stroke-width="2"/><text x="1450" y="141" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" fill="#17324d"><tspan x="1450" dy="0">Provider + receipt</tspan></text><line x1="1450" y1="165" x2="1450" y2="760" stroke="#a7b5c1" stroke-dasharray="6 6"/><line x1="157" y1="205" x2="467" y2="205" stroke="#286b93" stroke-width="2" marker-end="url(#arr)"/><rect x="141.5" y="207" width="342" height="18" fill="#fff" opacity="0.97"/><text x="312.5" y="219" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="normal" fill="#286b93"><tspan x="312.5" dy="0">Open SSE from last event ID</tspan></text><line x1="482" y1="271" x2="792" y2="271" stroke="#286b93" stroke-width="2" marker-end="url(#arr)"/><rect x="460.5" y="273" width="354" height="33" fill="#fff" opacity="0.97"/><text x="637.5" y="285" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="normal" fill="#286b93"><tspan x="637.5" dy="0">Replay persisted IDs through</tspan><tspan x="637.5" dy="14">watermark</tspan></text><line x1="807" y1="337" x2="467" y2="337" stroke="#286b93" stroke-width="2" marker-end="url(#arr)"/><rect x="457.5" y="339" width="360" height="18" fill="#fff" opacity="0.97"/><text x="637.5" y="351" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="normal" fill="#286b93"><tspan x="637.5" dy="0">Commit order + replay records</tspan></text><line x1="482" y1="403" x2="142" y2="403" stroke="#286b93" stroke-width="2" marker-end="url(#arr)"/><rect x="132.5" y="405" width="360" height="33" fill="#fff" opacity="0.97"/><text x="312.5" y="417" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="normal" fill="#286b93"><tspan x="312.5" dy="0">Deliver events once; reconnect</tspan><tspan x="312.5" dy="14">resumes cursor</tspan></text><path d="M1125 469 h35 v20 h-22" fill="none" stroke="#286b93" stroke-width="2" marker-end="url(#arr)"/><rect x="1023.0" y="471" width="360" height="33" fill="#fff" opacity="0.97"/><text x="1203" y="483" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="normal" fill="#286b93"><tspan x="1203" dy="0">Claim due job; recheck consent and</tspan><tspan x="1203" dy="14">lease</tspan></text><line x1="1132" y1="535" x2="1442" y2="535" stroke="#286b93" stroke-width="2" marker-end="url(#arr)"/><rect x="1116.5" y="537" width="342" height="33" fill="#fff" opacity="0.97"/><text x="1287.5" y="549" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="normal" fill="#286b93"><tspan x="1287.5" dy="0">Send generic payload / poll</tspan><tspan x="1287.5" dy="14">optional receipt</tspan></text><line x1="1457" y1="601" x2="1117" y2="601" stroke="#286b93" stroke-width="2" marker-end="url(#arr)"/><rect x="1107.5" y="603" width="360" height="33" fill="#fff" opacity="0.97"/><text x="1287.5" y="615" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="normal" fill="#286b93"><tspan x="1287.5" dy="0">Return accepted, transient, invalid</tspan><tspan x="1287.5" dy="14">or permanent</tspan></text><path d="M1125 667 h35 v20 h-22" fill="none" stroke="#286b93" stroke-width="2" marker-end="url(#arr)"/><rect x="1023.0" y="669" width="360" height="33" fill="#fff" opacity="0.97"/><text x="1203" y="681" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="normal" fill="#286b93"><tspan x="1203" dy="0">Persist retry/status; stale lease</tspan><tspan x="1203" dy="14">cannot overwrite</tspan></text></svg>