<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="850" viewBox="0 0 1040 850">
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#202631}.title{font-size:24px;font-weight:700}.sub{font-size:14px;fill:#4b5563}.actor{fill:#eef3fb;stroke:#3b5b83;stroke-width:2}.box{fill:#fff;stroke:#536579;stroke-width:2}.note{fill:#fff8e7;stroke:#bc8b20;stroke-width:1.5}.lifeline{stroke:#9aa5b1;stroke-width:1.4;stroke-dasharray:6 6}.msg{stroke:#334155;stroke-width:2;fill:none}.ret{stroke:#788493;stroke-width:1.5;stroke-dasharray:5 5;fill:none}.label{font-size:15px}.small{font-size:13px;fill:#46505c}.head{font-size:16px;font-weight:700}.association{stroke:#64748b;stroke-width:2;fill:none}</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#334155"/></marker><marker id="arrowleft" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M8,0 L0,4 L8,8 z" fill="#334155"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text class="title" x="32" y="38">UC14-F3 — Create and open a cross-client invite link</text>
<text class="sub" x="32" y="62">App URL consumer and invite parser are implemented at the source cut</text>
<rect class="actor" x="60" y="120" width="180" height="56" rx="9"/>
<text class="head" x="150" y="154" text-anchor="middle">Owner UI</text>
<line class="lifeline" x1="150" y1="176" x2="150" y2="735"/>
<rect class="actor" x="300" y="120" width="180" height="56" rx="9"/>
<text class="head" x="390" y="154" text-anchor="middle">Link functions</text>
<line class="lifeline" x1="390" y1="176" x2="390" y2="735"/>
<rect class="actor" x="560" y="120" width="180" height="56" rx="9"/>
<text class="head" x="650" y="154" text-anchor="middle">Browser / native client</text>
<line class="lifeline" x1="650" y1="176" x2="650" y2="735"/>
<rect class="actor" x="800" y="120" width="180" height="56" rx="9"/>
<text class="head" x="890" y="154" text-anchor="middle">App route consumer</text>
<line class="lifeline" x1="890" y1="176" x2="890" y2="735"/>
<line class="msg" x1="150" y1="225" x2="390" y2="225" marker-end="url(#arrow)"/>
<text class="label" x="270.0" y="190" text-anchor="middle">Share active invite through owner</text>
<text class="label" x="270.0" y="207" text-anchor="middle">UI</text>
<line class="msg" x1="390" y1="311" x2="650" y2="311" marker-end="url(#arrow)"/>
<text class="label" x="520.0" y="276" text-anchor="middle">createInviteLink validates</text>
<text class="label" x="520.0" y="293" text-anchor="middle">code/expiry and platform</text>
<line class="ret" x1="650" y1="397" x2="390" y2="397" marker-end="url(#arrowleft)"/>
<text class="label" x="520.0" y="362" text-anchor="middle">Web URL or native scheme; real</text>
<text class="label" x="520.0" y="379" text-anchor="middle">groupId requires HTTPS</text>
<line class="msg" x1="890" y1="483" x2="390" y2="483" marker-end="url(#arrowleft)"/>
<text class="label" x="640.0" y="448" text-anchor="middle">Open browser route or native</text>
<text class="label" x="640.0" y="465" text-anchor="middle">rewind://invite candidate</text>
<line class="msg" x1="390" y1="569" x2="650" y2="569" marker-end="url(#arrow)"/>
<text class="label" x="520.0" y="534" text-anchor="middle">parseInviteLink validates route,</text>
<text class="label" x="520.0" y="551" text-anchor="middle">duplicates, code and expiry</text>
<line class="msg" x1="650" y1="655" x2="890" y2="655" marker-end="url(#arrow)"/>
<text class="label" x="770.0" y="620" text-anchor="middle">Pass valid parsed intent to group</text>
<text class="label" x="770.0" y="637" text-anchor="middle">UI; web HTTPS path is E2E-covered</text>
<rect class="note" x="32" y="755" width="976" height="70" rx="8"/>
<text class="small" x="48" y="778" >Alternate / exception: Expired/revoked/malformed links are rejected. Current builder returns null for real-group</text>
<text class="small" x="48" y="795" >invite on native custom-scheme path; app.json declares scheme rewind but physical universal-link association remains</text>
<text class="small" x="48" y="812" >unverified. Browser HTTPS registration and acceptance are fixture-covered.</text>
</svg>
