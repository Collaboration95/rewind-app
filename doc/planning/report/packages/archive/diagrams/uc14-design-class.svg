<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="780" viewBox="0 0 1120 780">
<defs><marker id="class-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#334155"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#202631}.title{font-size:24px;font-weight:700}.sub{font-size:14px;fill:#4b5563}.actor{fill:#eef3fb;stroke:#3b5b83;stroke-width:2}.box{fill:#fff;stroke:#536579;stroke-width:2}.note{fill:#fff8e7;stroke:#bc8b20;stroke-width:1.5}.lifeline{stroke:#9aa5b1;stroke-width:1.4;stroke-dasharray:6 6}.msg{stroke:#334155;stroke-width:2;fill:none}.ret{stroke:#788493;stroke-width:1.5;stroke-dasharray:5 5;fill:none}.label{font-size:15px}.small{font-size:13px;fill:#46505c}.head{font-size:16px;font-weight:700}.association{stroke:#64748b;stroke-width:2;fill:none}.edge-link{stroke:#334155;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}.edge-link.conditional{stroke-dasharray:6 4}.edge-label{font-size:12px;fill:#334155;text-anchor:middle;paint-order:stroke fill;stroke:#fff;stroke-width:4px;stroke-linejoin:round}</style>
<rect width="100%" height="100%" fill="#ffffff"/>
<text class="title" x="32" y="38">UC14 — Design classes</text>
<text class="sub" x="32" y="62">Implemented URL consumption, invite parsing, and web lifecycle boundaries</text>
<rect class="box" x="48" y="105" width="475" height="153" rx="7"/>
<text class="head" x="66" y="133">App URL consumer + invite link functions</text>
<line class="association" x1="48" y1="147" x2="523" y2="147"/>
<text class="small" x="66" y="171">Reads browser URL or native Linking</text>
<text class="small" x="66" y="193">createInviteLink / parseInviteLink</text>
<text class="small" x="66" y="215">Valid URL intent is retained and</text>
<text class="small" x="66" y="237">passed to group UI</text>
<rect class="box" x="585" y="105" width="475" height="153" rx="7"/>
<text class="head" x="603" y="133">Real-account group UI</text>
<line class="association" x1="585" y1="147" x2="1060" y2="147"/>
<text class="small" x="603" y="171">Receives parsed invite intent</text>
<text class="small" x="603" y="193">from App URL consumer</text>
<text class="small" x="603" y="215">Web URL + native Linking</text>
<text class="small" x="603" y="237">acceptance via authenticated UI</text>
<rect class="box" x="48" y="415" width="475" height="153" rx="7"/>
<text class="head" x="66" y="443">Service Worker</text>
<line class="association" x1="48" y1="457" x2="523" y2="457"/>
<text class="small" x="66" y="481">Build-id shell Cache; complete</text>
<text class="small" x="66" y="503">warm + safe update</text>
<text class="small" x="66" y="525">API and media bypass cache;</text>
<text class="small" x="66" y="547">offline is explicit</text>
<rect class="box" x="585" y="415" width="475" height="153" rx="7"/>
<text class="head" x="603" y="443">Invite acceptance route</text>
<line class="association" x1="585" y1="457" x2="1060" y2="457"/>
<text class="small" x="603" y="481">POST code + group; validates</text>
<text class="small" x="603" y="503">session, invite and capacity</text>
<g aria-label="Class dependencies and associations"><path class="edge-link" d="M 285.5 258 V 280 H 822.5 V 266" marker-end="url(#class-arrow)"/><path class="edge-link" d="M 822.5 258 V 320 H 822.5 V 407" marker-end="url(#class-arrow)"/><path class="edge-link" d="M 355.5 415 V 365 H 752.5 V 266" marker-end="url(#class-arrow)"/><text class="edge-label" x="554" y="275">valid parsed intent → group UI</text><text class="edge-label" x="890" y="315">authenticated POST /accept</text><text class="edge-label" x="554" y="360">public shell only; API bypass</text></g><rect class="note" x="48" y="700" width="1010" height="50" rx="7"/>
<text class="small" x="64" y="722">Associations: App consumes browser/native URLs, parses invite intent, and passes valid intent to the group UI. The UI</text>
<text class="small" x="64" y="740">accepts through the authenticated route; physical-device URL association remains unverified.</text>
</svg>
