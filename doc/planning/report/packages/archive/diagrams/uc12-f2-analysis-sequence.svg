<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="850" viewBox="0 0 1040 850">
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#202631}.title{font-size:24px;font-weight:700}.sub{font-size:14px;fill:#4b5563}.actor{fill:#eef3fb;stroke:#3b5b83;stroke-width:2}.box{fill:#fff;stroke:#536579;stroke-width:2}.note{fill:#fff8e7;stroke:#bc8b20;stroke-width:1.5}.lifeline{stroke:#9aa5b1;stroke-width:1.4;stroke-dasharray:6 6}.msg{stroke:#334155;stroke-width:2;fill:none}.ret{stroke:#788493;stroke-width:1.5;stroke-dasharray:5 5;fill:none}.label{font-size:15px}.small{font-size:13px;fill:#46505c}.head{font-size:16px;font-weight:700}.association{stroke:#64748b;stroke-width:2;fill:none}</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#334155"/></marker><marker id="arrowleft" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M8,0 L0,4 L8,8 z" fill="#334155"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text class="title" x="32" y="38">UC12-F2 — Start or resume premiere playback</text>
<text class="sub" x="32" y="62">Analysis responsibility model; platform-neutral concepts</text>
<rect class="actor" x="60" y="120" width="180" height="56" rx="9"/>
<text class="head" x="150" y="154" text-anchor="middle">Member</text>
<line class="lifeline" x1="150" y1="176" x2="150" y2="735"/>
<rect class="actor" x="300" y="120" width="180" height="56" rx="9"/>
<text class="head" x="390" y="154" text-anchor="middle">Archive view</text>
<line class="lifeline" x1="390" y1="176" x2="390" y2="735"/>
<rect class="actor" x="560" y="120" width="180" height="56" rx="9"/>
<text class="head" x="650" y="154" text-anchor="middle">Group release</text>
<line class="lifeline" x1="650" y1="176" x2="650" y2="735"/>
<rect class="actor" x="800" y="120" width="180" height="56" rx="9"/>
<text class="head" x="890" y="154" text-anchor="middle">Media item</text>
<line class="lifeline" x1="890" y1="176" x2="890" y2="735"/>
<line class="msg" x1="150" y1="225" x2="390" y2="225" marker-end="url(#arrow)"/>
<text class="label" x="270.0" y="190" text-anchor="middle">Choose Play on a ready group</text>
<text class="label" x="270.0" y="207" text-anchor="middle">premiere</text>
<line class="msg" x1="390" y1="311" x2="650" y2="311" marker-end="url(#arrow)"/>
<text class="label" x="520.0" y="276" text-anchor="middle">Request current authorized</text>
<text class="label" x="520.0" y="293" text-anchor="middle">playback link</text>
<line class="msg" x1="650" y1="397" x2="890" y2="397" marker-end="url(#arrow)"/>
<text class="label" x="770.0" y="362" text-anchor="middle">Resolve capability and stream</text>
<text class="label" x="770.0" y="379" text-anchor="middle">verified released film</text>
<line class="ret" x1="890" y1="483" x2="390" y2="483" marker-end="url(#arrowleft)"/>
<text class="label" x="640.0" y="464" text-anchor="middle">Return media bytes or safe failure</text>
<line class="ret" x1="390" y1="553" x2="150" y2="553" marker-end="url(#arrowleft)"/>
<text class="label" x="270.0" y="518" text-anchor="middle">Play with controls and audio on</text>
<text class="label" x="270.0" y="535" text-anchor="middle">device</text>
<line class="msg" x1="150" y1="639" x2="390" y2="639" marker-end="url(#arrow)"/>
<text class="label" x="270.0" y="604" text-anchor="middle">Resume after app background /</text>
<text class="label" x="270.0" y="621" text-anchor="middle">refresh link</text>
<rect class="note" x="32" y="755" width="976" height="70" rx="8"/>
<text class="small" x="48" y="778" >Alternate / exception: Capability expires, session is revoked, membership/release changes, film is delayed/failed,</text>
<text class="small" x="48" y="795" >integrity check fails, or network/device playback fails; UI keeps safe state and offers retry.</text>
</svg>