# Included in every location because nginx does not inherit add_header when a
# location sets its own. Script hashes are generated from the exported HTML.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Strict-Transport-Security "max-age=31536000" always;
# react-native-web inserts style tags and element styles at runtime. Retain only
# the style exception; inline scripts require their exact build-time SHA-256.
# Blob fetches persist locally chosen photos; they do not permit another network origin.
# Cognito uses top-level GET redirects, not forms or cross-origin fetches.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' __SCRIPT_HASHES__; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: data:; connect-src 'self' blob: __UPLOAD_ORIGIN__; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; worker-src 'self' blob:; manifest-src 'self'; frame-src 'none'" always;
add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
# Private playback is same-origin; S3 PUT uses CORS. Browser playback regression
# checks must pass before this policy ships.
add_header Cross-Origin-Embedder-Policy "require-corp" always;
