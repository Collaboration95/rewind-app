upstream rewind_runtime {
    server runtime:8787;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    # The runtime caps staged photos at 10 MiB and clips at 50 MiB.
    client_max_body_size 50m;

    add_header X-Content-Type-Options "nosniff" always;

    # Keep the API under the browser origin. The trailing slash on proxy_pass
    # strips /api while preserving the query string and upstream status code.
    location = /api {
        proxy_pass http://rewind_runtime/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # CloudFront strips X-Forwarded-Proto. Its secret origin header is the
        # trusted proof of the HTTPS-only viewer path.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Rewind-Origin-Auth $http_x_rewind_origin_auth;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_intercept_errors on;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        # Preserve application 503 JSON so clients can recover from transfer failures.
        error_page 502 504 = @runtime_unavailable;
    }

    location ^~ /api/ {
        proxy_pass http://rewind_runtime/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Rewind-Origin-Auth $http_x_rewind_origin_auth;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_intercept_errors on;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        # Preserve application 503 JSON so clients can recover from transfer failures.
        error_page 502 504 = @runtime_unavailable;
    }

    location @runtime_unavailable {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 503 '{"error":"runtime_unavailable","message":"The Demo runtime is unavailable."}';
    }

    # Expo's content-hashed bundles are safe to cache for the artifact
    # lifetime. Missing assets are 404s, never the SPA shell.
    location ~* \.(?:css|gif|ico|jpe?g|js|map|png|svg|webp|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Public legal pages answer without sign-in at their extensionless paths
    # and never fall back to the SPA shell.
    location ~ ^/(privacy|support|terms)$ {
        try_files /$1.html =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /index.html {
        # Redirect direct or otherwise untrusted web entry requests to the
        # canonical HTTPS distribution, which supplies the trusted origin proof.
        if ($http_x_rewind_origin_auth = "") {
            return 302 https://d2m6kz76y4kuvm.cloudfront.net$request_uri;
        }
        try_files $uri =404;
        add_header Cache-Control "no-store" always;
    }

    # Client-side application routes receive the shell; extension-bearing
    # paths are handled above and cannot be silently rewritten to index.html.
    location / {
        if ($http_x_rewind_origin_auth = "") {
            return 302 https://d2m6kz76y4kuvm.cloudfront.net$request_uri;
        }
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
    }
}
