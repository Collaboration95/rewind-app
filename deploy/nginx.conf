upstream rewind_runtime {
    server runtime:8787;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options "nosniff" always;

    # Keep the API under the browser origin. The trailing slash on proxy_pass
    # strips /api while preserving the query string and upstream status code.
    location = /api {
        proxy_pass http://rewind_runtime/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_intercept_errors on;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        error_page 502 503 504 = @runtime_unavailable;
    }

    location ^~ /api/ {
        proxy_pass http://rewind_runtime/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_intercept_errors on;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        error_page 502 503 504 = @runtime_unavailable;
    }

    location @runtime_unavailable {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 503 '{"error":"runtime_unavailable","message":"The Demo runtime is unavailable."}';
    }

    # Expo's content-hashed bundles are safe to cache for the artifact
    # lifetime. Missing assets are 404s, never the SPA shell.
    location ~* \.(?:css|gif|ico|jpe?g|js|map|png|svg|webp|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-store" always;
    }

    # Client-side application routes receive the shell; extension-bearing
    # paths are handled above and cannot be silently rewritten to index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
    }
}
