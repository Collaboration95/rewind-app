<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6ede3" />
    <title>Rewind is offline</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
        background: #f6ede3;
        color: #2b211b;
      }
      html,
      body {
        background: #f6ede3;
      }
      body {
        box-sizing: border-box;
        display: grid;
        margin: 0;
        width: 100%;
        min-height: 100vh;
        min-height: 100dvh;
        padding: max(32px, env(safe-area-inset-top)) max(32px, env(safe-area-inset-right))
          max(32px, env(safe-area-inset-bottom)) max(32px, env(safe-area-inset-left));
        place-items: center;
      }
      main {
        max-width: 32rem;
        border: 1px solid #e3d3c3;
        background: rgba(255, 255, 255, 0.6);
        border-radius: 12px;
        padding: 24px;
      }
      h1 {
        margin-top: 0;
      }
      p {
        color: #6b5a4e;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <p>REWIND</p>
      <h1>Connection unavailable</h1>
      <p>
        Server-backed actions are unavailable offline. Reconnect to the local runtime to continue.
      </p>
      <p>Captured media is not synchronized offline.</p>
    </main>
  </body>
</html>
