<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1D1B1E" />
    <title>Rewind is offline</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
        background: #252326;
        color: #f9ebd5;
      }
      body {
        box-sizing: border-box;
        display: grid;
        margin: 0;
        min-height: 100vh;
        padding: 32px;
        place-items: center;
      }
      main {
        max-width: 32rem;
        border: 1px solid #51474a;
        border-radius: 12px;
        padding: 24px;
      }
      h1 {
        margin-top: 0;
      }
      p {
        color: #b9aba0;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <p>REWIND</p>
      <h1>Connection unavailable</h1>
      <p>
        Server-backed actions are unavailable offline. Reconnect to the local runtime to continue.
      </p>
      <p>Captured media is not synchronized offline.</p>
    </main>
  </body>
</html>
