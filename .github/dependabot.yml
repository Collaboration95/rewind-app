# Low-noise version updates: one grouped PR per ecosystem per month.
# Security updates are governed by the repository's Dependabot security
# settings and are not limited by this file.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      npm-all:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
      # The Expo SDK pins these; move them with `npx expo install --fix` on an
      # SDK upgrade instead (React Native 0.87 broke jest-expo on SDK 57).
      - dependency-name: react
        update-types: [version-update:semver-minor, version-update:semver-patch]
      - dependency-name: react-dom
        update-types: [version-update:semver-minor, version-update:semver-patch]
      - dependency-name: '@types/react'
        update-types: [version-update:semver-minor]
      - dependency-name: react-native
        update-types: [version-update:semver-minor, version-update:semver-patch]
      - dependency-name: react-native-safe-area-context
        update-types: [version-update:semver-minor]
      - dependency-name: react-native-svg
        update-types: [version-update:semver-minor, version-update:semver-patch]
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions-all:
        patterns: ['*']
  - package-ecosystem: docker
    directory: /deploy
    target-branch: dev
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      docker-all:
        patterns: ['*']
