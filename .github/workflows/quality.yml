name: Quality checks

on:
  push:
    branches: [main, dev]
  # Include stacked PRs; feature-branch pushes do not duplicate PR runs.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Classify change scope
    runs-on: ubuntu-24.04
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Fetch the comparison base commit
        env:
          GH_TOKEN: ${{ github.token }}
          REWIND_CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        # The classifier compares two trees, so it needs the base commit but no history.
        # A base that is gone (new branch, force-push) makes it fail safe: every check runs.
        run: |
          if [ -n "$REWIND_CHANGE_BASE" ]; then
            git fetch --no-tags --depth=1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$REWIND_CHANGE_BASE" ||
              echo 'Base commit unavailable; every check will run.'
          fi
      - name: Classify the exact checked change
        id: scope
        env:
          REWIND_CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          REWIND_CHANGE_HEAD: ${{ github.sha }}
        run: node scripts/classify-quality-changes.mjs

  # One matrix job: each cheap check runs in parallel and reports on its own, and the gate
  # reads the single aggregated result (success only when every leg passes).
  checks:
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    name: Static check (${{ matrix.check }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        check: [format:check, lint, architecture:check, typecheck]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Run the check
        env:
          CHECK: ${{ matrix.check }}
        run: npm run "$CHECK"

  audit:
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    name: Production dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      # The audit reads package-lock.json and the registry, so it needs no install.
      - run: npm audit --omit=dev --audit-level=high

  static:
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    name: Root and IaC tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Only the root HTTP integration test (tests/direct-transfer-http.test.mjs) drives Chromium.
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright-core'].version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-ubuntu-24.04-${{ steps.playwright.outputs.version }}
      - name: Install browser and media runtime for root HTTP integration
        # A cache hit makes the install skip the browser download; the system
        # libraries are installed either way.
        run: |
          command -v ffmpeg >/dev/null || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          npx playwright install --with-deps chromium
      - name: Run root and Terraform policy tests
        run: npm run test:root
      - name: Test IaC scan gate failure cases
        run: python3 -m unittest discover -s tests/security -p 'test_*.py'

  server:
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    name: Server tests and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install FFmpeg
        run: command -v ffmpeg >/dev/null || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Run server tests and collect separate coverage
        run: |
          npm run server:build
          mkdir -p coverage/server-v8
          set -o pipefail
          NODE_V8_COVERAGE=coverage/server-v8 node --experimental-test-coverage '--test-coverage-include=server/dist/**/*.js' --test server/tests/*.test.mjs | tee coverage/server-summary.txt
      - name: Retain server coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-coverage
          path: |
            coverage/server-summary.txt
            coverage/server-v8/*.json
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    name: Frontend tests and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Run Jest with measured statement gate
        run: npx jest --coverage
      - name: Retain frontend coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-coverage
          path: coverage/coverage-summary.json
          if-no-files-found: ignore
          retention-days: 14

  browser:
    needs: changes
    name: Web export and browser checks
    # Keep browser coverage on the reviewed release path, but out of dev PRs.
    if: ${{ needs.changes.outputs.docs_only != 'true' && (github.ref == 'refs/heads/main' || github.base_ref == 'main') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright-core'].version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-ubuntu-24.04-${{ steps.playwright.outputs.version }}
      - name: Install browser and media runtime
        # A cache hit makes the install skip the browser download; the system
        # libraries are installed either way.
        run: |
          command -v ffmpeg >/dev/null || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          npx playwright install --with-deps chromium
      - name: Export once and check PWA, accessibility, and responsive behavior
        run: |
          npm run build:web
          node scripts/check-pwa.mjs dist
          npx playwright test

  fixtures:
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    name: Cloud-free deployment fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The bash and Python fixtures use nothing from node_modules, so no install.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Run backup, lifecycle, restore, and host fixtures
        run: |
          bash tests/deploy/backup-manifest.test.sh
          bash tests/deploy/wake-recovery-selection.test.sh
          bash tests/deploy/lifecycle-guards.test.sh
          bash tests/deploy/recovery-smoke.test.sh
          bash tests/deploy/restore-atomic.test.sh
          bash tests/deploy/ownership-contract.test.sh
          bash tests/deploy/host-preflight.test.sh
          bash deploy/tests/host-bootstrap.test.sh
          for fixture in tests/deploy/*release*.test.sh deploy/tests/*release*.test.sh; do
            if [ -f "$fixture" ]; then bash "$fixture"; fi
          done

  server-postgres:
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    name: Server tests on PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        # postgres:17-alpine, the hosted Lightsail engine version (#261).
        image: postgres@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install FFmpeg
        run: command -v ffmpeg >/dev/null || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Run the server suite against PostgreSQL
        env:
          REWIND_TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
        run: npm run server:test:postgres

  gate:
    # Keep this name stable for the existing branch-protection requirement.
    name: Format, lint, typecheck, and test
    needs: [changes, checks, audit, static, server, server-postgres, frontend, browser, fixtures]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful scope classification
        run: test '${{ needs.changes.result }}' = success
      - name: Complete documentation-only Quality
        if: ${{ needs.changes.outputs.docs_only == 'true' }}
        run: |
          test '${{ needs.checks.result }}' = skipped
          test '${{ needs.audit.result }}' = skipped
          test '${{ needs.static.result }}' = skipped
          test '${{ needs.server.result }}' = skipped
          test '${{ needs.server-postgres.result }}' = skipped
          test '${{ needs.frontend.result }}' = skipped
          test '${{ needs.browser.result }}' = skipped
          test '${{ needs.fixtures.result }}' = skipped
          echo 'Only non-executable documentation changed. No application tests ran.'
      - name: Require every quality job to succeed
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        run: |
          test '${{ needs.checks.result }}' = success
          test '${{ needs.audit.result }}' = success
          test '${{ needs.static.result }}' = success
          test '${{ needs.server.result }}' = success
          test '${{ needs.server-postgres.result }}' = success
          test '${{ needs.frontend.result }}' = success
          test '${{ needs.fixtures.result }}' = success
      - name: Require browser checks on main
        if: ${{ needs.changes.outputs.docs_only != 'true' && (github.ref == 'refs/heads/main' || github.base_ref == 'main') }}
        run: test '${{ needs.browser.result }}' = success
