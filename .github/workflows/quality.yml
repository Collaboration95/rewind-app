name: Quality checks

on:
  push:
    branches: [main]
  # PR checks intentionally have no base-branch filter so stacked PRs run the
  # same validation. Feature-branch pushes stay excluded to avoid duplicate runs.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  baseline:
    name: Format, lint, typecheck, and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install FFmpeg for the local runtime gate
        run: command -v ffmpeg >/dev/null || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Install Chromium for accessibility and responsive checks
        run: npx playwright install --with-deps chromium

      - name: Run baseline checks
        run: npm run check

      - name: Build and validate the installable web shell
        run: npm run test:pwa

      - name: Run responsive browser checks
        run: npm run test:responsive
