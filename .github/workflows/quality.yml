name: Quality checks

on:
  workflow_call:
  push:
    branches: [main, dev]
  # Include stacked PRs; feature-branch pushes do not duplicate PR runs.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Classify change scope
    runs-on: ubuntu-24.04
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Classify the exact checked change
        id: scope
        env:
          REWIND_CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          REWIND_CHANGE_HEAD: ${{ github.sha }}
        run: node scripts/classify-quality-changes.mjs

  static:
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    name: Static and root tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check source and production dependencies
        run: |
          npm run format:check
          npm run lint
          npm run architecture:check
          npm run typecheck
          npm audit --omit=dev --audit-level=high
      - name: Run root and Terraform policy tests
        run: node --test tests/scaffold.test.mjs tests/architecture.test.mjs tests/pwa.test.mjs tests/web-deployment.test.mjs tests/deploy/host-lifecycle-smoke.test.mjs tests/terraform/*.test.mjs
      - name: Test IaC scan gate failure cases
        run: python3 -m unittest discover -s tests/security -p 'test_*.py'

  server:
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    name: Server tests and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install FFmpeg
        run: command -v ffmpeg >/dev/null || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Run server tests and collect separate coverage
        run: |
          npm run server:build
          mkdir -p coverage/server-v8
          set -o pipefail
          NODE_V8_COVERAGE=coverage/server-v8 node --experimental-test-coverage '--test-coverage-include=server/dist/**/*.js' --test server/tests/*.test.mjs | tee coverage/server-summary.txt
      - name: Retain server coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-coverage
          path: |
            coverage/server-summary.txt
            coverage/server-v8/*.json
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    name: Frontend tests and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Run Jest with measured statement gate
        run: npx jest --runInBand --coverage
      - name: Retain frontend coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-coverage
          path: coverage/coverage-summary.json
          if-no-files-found: ignore
          retention-days: 14

  browser:
    needs: changes
    name: Web export and browser checks
    # Keep browser coverage on the reviewed release path, but out of dev PRs.
    if: ${{ needs.changes.outputs.docs_only != 'true' && (github.ref == 'refs/heads/main' || github.base_ref == 'main') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install browser and media runtime
        run: |
          command -v ffmpeg >/dev/null || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          npx playwright install --with-deps chromium
      - name: Export once and check PWA, accessibility, and responsive behavior
        run: |
          npm run build:web
          node scripts/check-pwa.mjs dist
          npx playwright test

  fixtures:
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    name: Cloud-free deployment fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Run backup, lifecycle, restore, and host fixtures
        run: |
          bash tests/deploy/backup-manifest.test.sh
          bash tests/deploy/wake-recovery-selection.test.sh
          bash tests/deploy/lifecycle-guards.test.sh
          bash tests/deploy/recovery-smoke.test.sh
          bash tests/deploy/restore-atomic.test.sh
          bash tests/deploy/ownership-contract.test.sh
          bash tests/deploy/host-preflight.test.sh
          bash deploy/tests/host-bootstrap.test.sh
          for fixture in tests/deploy/*release*.test.sh deploy/tests/*release*.test.sh; do
            if [ -f "$fixture" ]; then bash "$fixture"; fi
          done

  gate:
    # Keep this name stable for the existing branch-protection requirement.
    name: Format, lint, typecheck, and test
    needs: [changes, static, server, frontend, browser, fixtures]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful scope classification
        run: test '${{ needs.changes.result }}' = success
      - name: Complete documentation-only Quality
        if: ${{ needs.changes.outputs.docs_only == 'true' }}
        run: |
          test '${{ needs.static.result }}' = skipped
          test '${{ needs.server.result }}' = skipped
          test '${{ needs.frontend.result }}' = skipped
          test '${{ needs.browser.result }}' = skipped
          test '${{ needs.fixtures.result }}' = skipped
          echo 'Only non-executable documentation changed. No application tests ran.'
      - name: Require every quality job to succeed
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        run: |
          test '${{ needs.static.result }}' = success
          test '${{ needs.server.result }}' = success
          test '${{ needs.frontend.result }}' = success
          test '${{ needs.fixtures.result }}' = success
      - name: Require browser checks on main
        if: ${{ needs.changes.outputs.docs_only != 'true' && (github.ref == 'refs/heads/main' || github.base_ref == 'main') }}
        run: test '${{ needs.browser.result }}' = success
