name: Quality checks

on:
  push:
    branches: [main]
  # PR checks intentionally have no base-branch filter so stacked PRs run the
  # same validation. Feature-branch pushes stay excluded to avoid duplicate runs.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  baseline:
    name: Format, lint, typecheck, and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install FFmpeg for the local runtime gate
        run: command -v ffmpeg >/dev/null || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Install Chromium for accessibility and responsive checks
        run: npx playwright install --with-deps chromium

      - name: Check source and run application tests with coverage
        run: |
          npm run format:check
          npm run lint
          npm run architecture:check
          npm run typecheck
          node --test tests/scaffold.test.mjs tests/architecture.test.mjs tests/pwa.test.mjs tests/web-deployment.test.mjs tests/deploy/host-lifecycle-smoke.test.mjs tests/terraform/*.test.mjs
          npm run server:build
          node --experimental-test-coverage '--test-coverage-include=server/dist/**/*.js' --test server/tests/*.test.mjs
          npx jest --runInBand --coverage

      - name: Run cloud-free deployment fixtures
        run: |
          bash tests/deploy/backup-manifest.test.sh
          bash tests/deploy/wake-recovery-selection.test.sh
          bash tests/deploy/lifecycle-guards.test.sh
          bash tests/deploy/recovery-smoke.test.sh
          bash tests/deploy/restore-atomic.test.sh
          bash tests/deploy/ownership-contract.test.sh
          bash tests/deploy/host-preflight.test.sh
          bash deploy/tests/host-bootstrap.test.sh

      - name: Export web app once and verify PWA and browser behavior
        run: |
          npm run build:web
          node scripts/check-pwa.mjs dist
          npx playwright test

      - name: Retain frontend coverage baseline
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-coverage
          path: coverage/coverage-summary.json
          if-no-files-found: ignore
          retention-days: 14
