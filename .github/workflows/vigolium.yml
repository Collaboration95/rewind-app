name: Vigolium security scan

on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vigolium-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Validate report generation
        run: node --test tests/vigolium-summary.test.mjs tests/vigolium-agentic.test.mjs
      - name: Prepare local-only agentic discovery input
        run: npm run security:explore
      - name: Scan disposable backend
        run: npm run security:auto
      - name: Active checks on disposable backend
        run: npm run security:active
      - name: Retain security reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vigolium-report
          path: |
            vigolium-result/automatic/
            vigolium-result/active/
          if-no-files-found: warn
          retention-days: 14
