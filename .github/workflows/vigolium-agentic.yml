name: Vigolium agentic trial

on:
  push:
    branches: [dev, codex/vigolium-agentic-provider]
  pull_request:
    branches: [dev]
  workflow_dispatch:
    inputs:
      endpoint:
        description: Disposable endpoint to assess
        type: choice
        options: [all, fixture, chat, groups, access]
        default: all
      model:
        description: OpenAI model available to the configured API account
        type: string
        default: gpt-6.1-sol
        required: true
      allow_ai_data:
        description: Allow disposable HTTP requests, responses and temporary auth tokens to OpenAI
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: vigolium-agentic-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Trial branch Quality validation
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/vigolium-agentic-provider'
    uses: ./.github/workflows/quality.yml
  offline:
    name: Offline setup and access checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run server:build
      - name: Validate harness and workflow boundaries
        run: node --test tests/vigolium-rewind.test.mjs tests/vigolium-provider.test.mjs tests/vigolium-fixture.test.mjs tests/vigolium-summary.test.mjs tests/vigolium-workflow.test.mjs tests/vigolium-access.test.mjs
      - run: node scripts/run-vigolium-rewind.mjs --build
      - name: Verify offline isolation, defect and control
        run: node scripts/run-vigolium-container.mjs --verify
      - name: Verify both endpoint seeds and role checks
        run: |
          node scripts/run-vigolium-rewind.mjs --verify --endpoint chat
          node scripts/run-vigolium-rewind.mjs --verify --endpoint groups
          node scripts/run-vigolium-rewind.mjs --verify --endpoint access
      - name: Retain offline evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vigolium-offline
          path: |
            vigolium-result/agentic*/summary.html
            vigolium-result/agentic*/scope.json
            vigolium-result/agentic*/isolation.json
          if-no-files-found: warn
          retention-days: 7
  trial:
    name: Live ${{ matrix.target }} trial
    needs: offline
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/codex/vigolium-agentic-provider') &&
      (github.event_name == 'push' || inputs.allow_ai_data)
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.endpoint != 'all' && format('["{0}"]', inputs.endpoint) || '["fixture","chat","groups","access"]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run server:build
      - name: Validate scanner harness and access checks
        run: node --test tests/vigolium-rewind.test.mjs tests/vigolium-provider.test.mjs tests/vigolium-fixture.test.mjs tests/vigolium-summary.test.mjs tests/vigolium-workflow.test.mjs tests/vigolium-access.test.mjs
      - name: Build isolated scanner and disposable backend
        run: node scripts/run-vigolium-rewind.mjs --build
      - name: Run approved OpenAI trial
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REWIND_AGENT_MODEL: ${{ inputs.model || 'gpt-6.1-sol' }}
          REWIND_AGENT_ENDPOINT: ${{ matrix.target }}
          REWIND_AGENT_PROVIDER: openai-responses
          REWIND_AGENT_DATA_SHARING: approved
          REWIND_AGENT_REWIND_DATA_SHARING: approved
        run: |
          if [ "$REWIND_AGENT_ENDPOINT" = fixture ]; then
            node scripts/run-vigolium-container.mjs --run
          else
            node scripts/run-vigolium-rewind.mjs --run --endpoint "$REWIND_AGENT_ENDPOINT"
          fi
      - name: Summarize evidence
        if: always()
        env:
          REWIND_AGENT_ENDPOINT: ${{ matrix.target }}
        run: node scripts/summarize-vigolium-ci.mjs
      - name: Retain redacted reports only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vigolium-agentic-${{ matrix.target }}
          path: |
            vigolium-result/agentic*/summary.html
            vigolium-result/agentic*/report.html
            vigolium-result/agentic*/report.jsonl
            vigolium-result/agentic*/native-report.html
            vigolium-result/agentic*/scope.json
            vigolium-result/agentic*/app-baselines.json
          if-no-files-found: warn
          retention-days: 7
