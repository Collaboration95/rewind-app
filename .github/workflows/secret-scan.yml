name: Secret scan

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks full-history scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out the complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan secrets with default rules and documented false positives
        run: |
          mkdir -p secret-results
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --no-banner --exit-code 1 \
            --config /repo/.gitleaks.toml \
            --report-format sarif --report-path /repo/secret-results/gitleaks.sarif
      - name: Retain the redacted SARIF report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-${{ github.sha }}
          path: secret-results/gitleaks.sarif
          if-no-files-found: warn
          retention-days: 30
      - name: Upload secrets to code scanning
        # Fork pull requests have read-only tokens; their SARIF is still an artifact.
        if: ${{ always() && hashFiles('secret-results/gitleaks.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: secret-results/gitleaks.sarif
          category: gitleaks
      - name: Summarise the secret scan
        if: always()
        run: |
          if [ -f secret-results/gitleaks.sarif ]; then
            count="$(jq '[.runs[].results[]] | length' secret-results/gitleaks.sarif)"
            printf '### Gitleaks full history\n\n| Findings | Artifact |\n| ---: | --- |\n| %s | gitleaks.sarif (redacted) |\n' "$count" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Gitleaks produced no SARIF; inspect the scan step failure.' >> "$GITHUB_STEP_SUMMARY"
          fi
