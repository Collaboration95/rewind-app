name: Release security

on:
  pull_request:
    paths:
      - .github/workflows/**
      - .github/iac-scan-exceptions.json
      - scripts/check-iac-scan.py
      - app.json
      - App.tsx
      - package.json
      - package-lock.json
      - public/**
      - src/**
      - server/**
      - deploy/**
      - infra/**
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  images:
    name: Scan ${{ matrix.image }} image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: runtime
            dockerfile: deploy/Dockerfile
          - image: web
            dockerfile: deploy/web.Dockerfile
    steps:
      - name: Check out candidate source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Build candidate image
        run: docker build --file '${{ matrix.dockerfile }}' --tag 'rewind-${{ matrix.image }}:candidate' .
      - name: Record immutable image identity
        run: |
          mkdir -p scan-results
          printf 'source_commit=%s\nimage_id=%s\n' "$GITHUB_SHA" "$(docker image inspect --format '{{.Id}}' 'rewind-${{ matrix.image }}:candidate')" > 'scan-results/${{ matrix.image }}-image-identity.txt'
      - name: Generate CycloneDX image SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: rewind-${{ matrix.image }}:candidate
          version: v0.70.0
          format: cyclonedx
          output: scan-results/${{ matrix.image }}-sbom.cdx.json
          cache: 'false'
      - name: Scan image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: rewind-${{ matrix.image }}:candidate
          version: v0.70.0
          skip-setup-trivy: true
          scanners: vuln
          format: table
          output: scan-results/${{ matrix.image }}-vulnerabilities.txt
          severity: HIGH,CRITICAL
          exit-code: '1'
          cache: 'false'
      - name: Retain image scan and SBOM with image identity
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-security-${{ matrix.image }}-${{ github.sha }}
          path: scan-results/
          if-no-files-found: error
          retention-days: 30

  iac:
    name: Scan IaC configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out candidate source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Retain complete Terraform and Docker findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          version: v0.70.0
          format: json
          output: iac-full.json
          cache: 'false'
      - name: Gate exact findings with expiring decisions
        run: python3 scripts/check-iac-scan.py iac-full.json
      - name: Retain IaC scan
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-security-iac-${{ github.sha }}
          path: iac-full.json
          if-no-files-found: error
          retention-days: 30
