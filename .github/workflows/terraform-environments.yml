name: Reviewed media Terraform

# Preparation only: environments and identities are NOT provisioned by this file.
# Public repository operations fail before AWS credentials: saved plans include state.
# No pull_request trigger: untrusted code must never receive state credentials.
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [dev, prod]
        required: true
      operation:
        type: choice
        options: [plan, apply]
        required: true
      quiescent_environment:
        description: Confirm external Terraform writers are stopped for this environment
        type: boolean
        default: false
        required: true
      plan_run_id:
        description: For apply, successful reviewed plan run ID at this exact head
        type: string
      plan_run_attempt:
        description: For apply, reviewed plan run attempt
        type: string
      reviewed_plan_sha256:
        description: For apply, SHA-256 of the reviewed binary media.tfplan
        type: string

permissions:
  contents: read

concurrency:
  group: terraform-media-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  media:
    if: ${{ (inputs.environment == 'dev' && github.ref == 'refs/heads/dev') || (inputs.environment == 'prod' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: terraform-${{ inputs.environment }}-${{ inputs.operation }}
    permissions:
      contents: read
      actions: read
      checks: read
      id-token: write
    env:
      # Fine-grained read-only GitHub token must support environment/protection
      # inspection; insufficient permissions or missing configuration fail closed.
      GH_TOKEN: ${{ secrets.TERRAFORM_GH_READ_TOKEN }}
      QUIESCENT_ENVIRONMENT: ${{ inputs.quiescent_environment }}
      MEDIA_KMS_KEY_ARN: ${{ vars.MEDIA_KMS_KEY_ARN }}
      MEDIA_CORS_ORIGIN: ${{ vars.MEDIA_CORS_ORIGIN }}
      PLAN_RUN_ID: ${{ inputs.plan_run_id }}
      PLAN_RUN_ATTEMPT: ${{ inputs.plan_run_attempt }}
      REVIEWED_PLAN_SHA256: ${{ inputs.reviewed_plan_sha256 }}
      TF_IN_AUTOMATION: 'true'
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Refuse missing protections and non-green exact heads before assuming AWS role
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          OPERATION: ${{ inputs.operation }}
        run: node infra/scripts/terraform-environment.mjs preflight "$TARGET_ENVIRONMENT" "$OPERATION"
      - name: Download and verify human-reviewed saved plan before AWS credentials
        if: ${{ inputs.operation == 'apply' }}
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: node infra/scripts/terraform-environment.mjs download "$TARGET_ENVIRONMENT" apply
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.16.0
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@a03048d87541d1d9fcf2ecf528a4a65ba9bd7838 # v5.0.0
        with:
          role-to-assume: arn:aws:iam::330599756236:role/rewind-${{ inputs.environment }}-terraform-${{ inputs.operation }}
          aws-region: ap-southeast-1
          allowed-account-ids: '330599756236'
          role-duration-seconds: 900
          unset-current-credentials: true
      - name: Execute scoped media operation
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          OPERATION: ${{ inputs.operation }}
        run: node infra/scripts/terraform-environment.mjs run "$TARGET_ENVIRONMENT" "$OPERATION"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ inputs.operation == 'plan' }}
        with:
          name: media-plan-${{ inputs.environment }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/reviewed-media-plan/
          if-no-files-found: error
          retention-days: 1
