name: Reviewed media Terraform

# Preparation only: environments and identities are NOT provisioned by this file.
# Saved plans stay in the existing private S3 state bucket; no GitHub artifacts.
# No pull_request trigger: untrusted code must never receive state credentials.
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [dev, prod]
        required: true
      operation:
        type: choice
        options: [plan, apply]
        required: true
      quiescent_environment:
        description: Confirm external Terraform writers are stopped for this environment
        type: boolean
        default: false
        required: true
      plan_run_id:
        description: For apply, successful reviewed plan run ID at this exact head
        type: string
      plan_run_attempt:
        description: For apply, reviewed plan run attempt
        type: string
      reviewed_plan_sha256:
        description: For apply, SHA-256 of the reviewed binary plan.tfplan
        type: string

      reviewed_metadata_sha256:
        description: For apply, SHA-256 of the human-reviewed private metadata.json
        type: string
      reviewed_metadata_version_id:
        description: For apply, exact S3 version of the reviewed private metadata.json
        type: string

permissions:
  contents: read

concurrency:
  group: terraform-media-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  media:
    if: ${{ (inputs.environment == 'dev' && github.ref == 'refs/heads/dev') || (inputs.environment == 'prod' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: terraform-${{ inputs.environment }}-${{ inputs.operation }}
    permissions:
      contents: read
      actions: read
      checks: read
      id-token: write
    env:
      # Fine-grained read-only GitHub token must support environment/protection
      # inspection; insufficient permissions or missing configuration fail closed.
      GH_TOKEN: ${{ secrets.TERRAFORM_GH_READ_TOKEN }}
      QUIESCENT_ENVIRONMENT: ${{ inputs.quiescent_environment }}
      MEDIA_KMS_KEY_ARN: ${{ vars.MEDIA_KMS_KEY_ARN }}
      MEDIA_CORS_ORIGIN: ${{ vars.MEDIA_CORS_ORIGIN }}
      PLAN_RUN_ID: ${{ inputs.plan_run_id }}
      PLAN_RUN_ATTEMPT: ${{ inputs.plan_run_attempt }}
      REVIEWED_PLAN_SHA256: ${{ inputs.reviewed_plan_sha256 }}
      REVIEWED_METADATA_SHA256: ${{ inputs.reviewed_metadata_sha256 }}
      REVIEWED_METADATA_VERSION_ID: ${{ inputs.reviewed_metadata_version_id }}
      TF_IN_AUTOMATION: 'true'
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Refuse missing protections and non-green exact heads before assuming AWS role
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          OPERATION: ${{ inputs.operation }}
        run: node infra/scripts/terraform-environment.mjs preflight "$TARGET_ENVIRONMENT" "$OPERATION"
      - name: Verify approval inputs and source workflow run before AWS credentials
        if: ${{ inputs.operation == 'apply' }}
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: node infra/scripts/terraform-environment.mjs source "$TARGET_ENVIRONMENT" apply
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.0
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::330599756236:role/rewind-${{ inputs.environment }}-terraform-${{ inputs.operation }}
          aws-region: ap-southeast-1
          allowed-account-ids: '330599756236'
          role-duration-seconds: 900
          unset-current-credentials: true
      - name: Retrieve exact human-reviewed private S3 plan
        if: ${{ inputs.operation == 'apply' }}
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: node infra/scripts/terraform-environment.mjs download "$TARGET_ENVIRONMENT" apply
      - name: Execute scoped media operation
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          OPERATION: ${{ inputs.operation }}
        run: node infra/scripts/terraform-environment.mjs run "$TARGET_ENVIRONMENT" "$OPERATION"
